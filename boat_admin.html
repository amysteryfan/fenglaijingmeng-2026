<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>风来水榭 - 管理系统平台</title>
    <!-- 引用全局样式 -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* 页面重置与背景设定 */
        body.boat-guest-page {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #174e5c; /* 备用底色 */
        }

        /* 全屏背景图 */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/boat_bg_admin.jpg');
            background-size: cover;
            background-position: center 35%; 
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.85); /* 微微压暗以突出前景卡片 */
        }

        /* 左上角 Logo */
        .top-logo {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 20;
            width: 120px;
            height: auto;
            transition: transform 0.3s ease;
        }
        .top-logo:hover {
            transform: scale(1.05);
        }

        /* 右上角 退出/返回 按钮 */
        .exit-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 22px;
            font-weight: 300;
        }
        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* 主功能卡片容器 */
        .grid-container {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 620px;
            width: 90%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 单个卡片设计（厚重、稳固质感） */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            aspect-ratio: 1 / 1;
            min-height: 140px;
            
            /* 调整边框，加粗并增加不透明度，凸显实心厚重感 */
            border: 2px solid rgba(255, 255, 255, 0.15); 
            /* 增加内阴影：制造微微的向下凹陷/内发光效果，体现厚实感 */
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08), 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        /* 悬停时依然保持内部的厚重，外部阴影加重并微微抬起 */
        .card:hover {
            transform: translateY(-4px);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08), 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .card:active {
            transform: scale(0.95);
        }

        /* 卡片内部图标 */
        .card svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* 卡片文字 */
        .card h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* 改进后的四个板块颜色（深色沉稳版） */
        .card-color-1 { background: rgba(15, 45, 75, 0.95); }   /* 深海蓝 */
        .card-color-2 { background: rgba(25, 95, 145, 0.95); }  /* 深钢蓝 */
        .card-color-3 { background: rgba(15, 110, 95, 0.95); }  /* 深涧绿 */
        .card-color-4 { background: rgba(20, 115, 55, 0.95); }  /* 深林绿 */

        /* 移动端适配 */
        @media (max-width: 600px) {
            .top-logo {
                top: 20px;
                left: 20px;
                width: 80px;
            }
            .exit-btn {
                top: 20px;
                right: 20px;
                width: 38px;
                height: 38px;
                font-size: 18px;
            }
            .grid-container {
                gap: 16px;
                width: 92%;
                padding: 15px;
                border-radius: 24px;
            }
            .card {
                padding: 20px 10px;
                min-height: 100px;
            }
            .card svg {
                width: 36px;
                height: 36px;
                margin-bottom: 10px;
            }
            .card h3 {
                font-size: 15px;
                letter-spacing: 1px;
            }
            .bg-image {
                background-position: center 25%; 
            }
        }

        @media (max-width: 400px) {
            .card h3 {
                font-size: 13px;
            }
            .card svg {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body class="boat-guest-page">

    <!-- 背景图 -->
    <div class="bg-image"></div>

    <!-- 左上角 Logo -->
    <img src="images/boat_logo_white.png" alt="风来水榭" class="top-logo" onerror="this.style.display='none';">

    <!-- 右上角 退出/返回（点击回到搜索页面） -->
    <div class="exit-btn" onclick="window.location.href='search_fenglaishuixie.html'" title="返回登录">✕</div>

    <!-- 四个管理卡片（网格布局） -->
    <div class="grid-container">
        
        <!-- 卡片1：员工管理 -->
        <a href="javascript:void(0)" class="card card-color-1" onclick="window.location.href='boat_staff.html'">
            <svg viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <h3>员工管理</h3>
        </a>

        <!-- 卡片2：活动管理 -->
        <a href="javascript:void(0)" class="card card-color-2" onclick="alert('即将跳转至游轮活动排期与审批后台。')">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <circle cx="12" cy="15" r="1"/>
                <circle cx="16" cy="15" r="1"/>
                <circle cx="8" cy="15" r="1"/>
            </svg>
            <h3>活动管理</h3>
        </a>

        <!-- 卡片3：医疗管理 -->
        <a href="javascript:void(0)" class="card card-color-3" onclick="window.location.href='medical_record.html'">
            <svg viewBox="0 0 24 24">
                <path d="M12 2v20M2 12h20"/>
                <circle cx="12" cy="12" r="10"/>
            </svg>
            <h3>医疗管理</h3>
        </a>

        <!-- 卡片4：工作日志 【修改：跳转至 boat_manage.html】 -->
        <a href="javascript:void(0)" class="card card-color-4" onclick="window.location.href='boat_manage.html'">
            <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
            <h3>工作日志</h3>
        </a>

    </div>

    <!-- 引用全局脚本 -->
    <script src="js/main.js"></script>
</body>
</html>
