<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>风来惊梦 · 结局</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color:#0d1117; font-family:'Courier New',Courier,monospace;
            color:#d1d5db; cursor:default; -webkit-tap-highlight-color:transparent;
            overflow-y:auto; overflow-wrap:break-word;
        }
        .bg-layer {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background-image:url('../images/bg.jpg'); background-size:cover; background-position:center;
            filter:brightness(0.45) contrast(1.1) saturate(0.8); z-index:-2;
        }
        .crt-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-1;
            background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%),
                       repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
        }
        .container {
            width:90%; max-width:820px; min-height:100vh; padding:40px 50px; margin:0 auto;
            background:rgba(10,15,20,0.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
            border:1px solid rgba(150,100,80,0.25); box-shadow:0 20px 50px rgba(0,0,0,0.8);
            display:flex; flex-direction:column; position:relative;
        }
        .top-buttons { position:absolute; top:12px; right:16px; display:flex; align-items:center; gap:8px; z-index:10; }
        .close-x-btn {
            font-size:22px; color:#6b7280; background:transparent; border:none; cursor:pointer;
            font-family:'Courier New',Courier,monospace; transition:color 0.3s, transform 0.3s;
            line-height:1; padding:4px 8px;
        }
        .close-x-btn:hover { color:#ff4d4d; transform:scale(1.1); }
        .restart-btn {
            position:absolute; top:12px; left:16px; font-size:13px; color:#8a9aa8;
            background:rgba(30,40,50,0.5); border:1px solid rgba(120,130,140,0.3); cursor:pointer;
            font-family:'Courier New',Courier,monospace; transition:all 0.3s; padding:4px 10px;
            border-radius:4px; z-index:10;
        }
        .restart-btn:hover { color:#ff6b6b; border-color:rgba(255,107,107,0.5); background:rgba(60,30,30,0.5); }
        #text-display { display:flex; flex-direction:column; gap:12px; line-height:1.8; font-size:1.15rem; letter-spacing:0.02em; text-align:left; }
        .line { opacity:0; transform:translateY(10px); animation:fadeInUp 0.4s forwards ease-out; }
        @keyframes fadeInUp { to { opacity:1; transform:translateY(0); } }
        .cursor { display:inline-block; color:#a45c5c; animation:jumpBlink 1.2s infinite ease-in-out; user-select:none; }
        @keyframes jumpBlink { 0%,100% { transform:translateY(0); opacity:1; } 50% { transform:translateY(-8px); opacity:0.2; } }
        .summary-btn {
            margin-top:25px; padding:12px 30px; background:transparent; border:1px solid #a45c5c;
            color:#e0c0c0; font-family:'Courier New',Courier,monospace; font-size:1.1rem;
            cursor:pointer; transition:all 0.3s; align-self:center; display:block; margin:0 auto;
            box-shadow:0 0 8px rgba(164,92,92,0.2); letter-spacing:2px;
        }
        .summary-btn:hover { background:rgba(164,92,92,0.2); box-shadow:0 0 20px rgba(164,92,92,0.6); transform:scale(1.02); }
        .quiz-container { width:100%; text-align:center; padding-top:10px; }
        .question { font-size:1.3rem; font-weight:600; color:#e0e0e0; margin-bottom:6px; line-height:2.0; }
        .hint-text { font-size:0.8rem; color:#9ca3af; margin:2px 0 15px 0; letter-spacing:0.5px; opacity:0.7; }
        .options { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; max-width:600px; margin:15px auto 20px auto; }
        .option {
            background:rgba(30,40,50,0.7); border:1px solid #4a5a6a; border-radius:4px; padding:12px 10px;
            font-size:1.05rem; color:#b0c4d9; cursor:pointer; text-align:center; user-select:none;
            display:flex; justify-content:center; align-items:center; word-break:break-word;
            transition:opacity 0.2s, background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
        }
        .option:hover { background:rgba(60,80,100,0.5); border-color:#a45c5c; color:#fff; transform:translateY(-2px); }
        .option.correct { border-color:#4caf50; color:#4caf50; background:rgba(76,175,80,0.15); pointer-events:none; }
        .option.incorrect { pointer-events:none; opacity:0.6; }
        #error-msg { color:#ff4d4d; font-weight:bold; font-size:1.2rem; margin-top:15px; text-align:center; display:none; letter-spacing:3px; }
        @keyframes shake { 0%,100% { transform:translateX(0); } 10%,30%,50%,70%,90% { transform:translateX(-5px); } 20%,40%,60%,80% { transform:translateX(5px); } }
        .shake { animation:shake 0.5s ease-in-out; }
        .fill-input {
            background:rgba(10,15,20,0.6); border:1px solid #4a5a6a; border-radius:4px; padding:8px 12px;
            font-size:1.1rem; color:#d1d5db; width:140px; text-align:center;
            font-family:'Courier New',Courier,monospace; outline:none; transition:border 0.3s;
        }
        .fill-input:focus { border-color:#a45c5c; }
        .fill-input.error { border-color:#ff4d4d; color:#ff4d4d; }
        .fill-input.solved { border-color:#4caf50; color:#4caf50; pointer-events:none; background:rgba(76,175,80,0.05); }
        .submit-fill-btn {
            margin-top:20px; padding:8px 25px; background:transparent; border:1px solid #a45c5c;
            color:#e0c0c0; font-family:'Courier New',Courier,monospace; font-size:1rem; cursor:pointer;
            transition:all 0.3s;
        }
        .submit-fill-btn:hover { background:rgba(164,92,92,0.2); box-shadow:0 0 15px rgba(164,92,92,0.4); }
        .pool-container { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:15px 0; }
        .click-item {
            background:rgba(40,50,60,0.8); border:1px solid #5a6a7a; border-radius:4px;
            padding:8px 15px; font-size:1.05rem; color:#d1d5db; cursor:pointer; touch-action:auto;
            transition:all 0.2s; user-select:none; word-break:break-word;
        }
        .click-item:active { transform:scale(0.95); background:rgba(60,80,100,0.5); }
        .drop-zone {
            display:inline-block; min-width:100px; padding:18px 10px 6px 10px; margin:6px 14px;
            border-bottom:2px solid #a45c5c; color:#a45c5c; font-weight:bold;
            background:rgba(20,30,40,0.5); border-radius:2px; transition:all 0.2s;
            cursor:pointer; vertical-align:bottom; word-break:break-word;
        }
        .drop-zone.active { border-color:#fff; background:rgba(164,92,92,0.4); box-shadow:0 0 10px rgba(164,92,92,0.3); }
        .drop-zone.filled { border-color:#4caf50; color:#4caf50; }
        .story-text-block { text-align:justify; text-indent:2em; font-size:1.1rem; line-height:1.9; margin-bottom:10px; word-break:break-word; }
        .love-option { transition:all 0.3s; }
        .love-option.freeze { pointer-events:none; }
        .love-option.shake-red { animation:shake 0.5s ease-in-out; color:#ff4d4d!important; border-color:#ff4d4d!important; background:rgba(255,77,77,0.1); }
        .hate-option.final-red { color:#ff4d4d!important; border-color:#ff4d4d!important; background:rgba(255,77,77,0.15)!important; }
        .question-block { border-bottom:1px dashed #4a5a6a; padding-bottom:24px; margin-bottom:24px; }
        .question-block:last-child { border-bottom:none; }

        /* 时间表选项池吸附效果 */
        .sticky-pool {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(20, 25, 30, 0.95);
            padding: 10px;
            border-radius: 8px;
            margin: 0 -10px;
            backdrop-filter: blur(4px);
        }

        @media (max-width:640px) {
            .container { padding:20px 15px; }
            #text-display { font-size:1rem; gap:8px; }
            .options { grid-template-columns:repeat(2,1fr); gap:10px; max-width:100%; }
            .option { font-size:0.95rem; padding:10px 8px; }
            .question { font-size:1.15rem; line-height:1.8; }
            .fill-input { width:90px; font-size:1rem; }
            .pool-container { gap:6px; }
            .click-item { font-size:0.85rem; padding:6px 10px; }
            .drop-zone { min-width:70px; padding:14px 4px 4px 4px; margin:4px 4px; font-size:0.95rem; }
            .hint-text { font-size:0.7rem; }
            .close-x-btn { font-size:18px; }
            .restart-btn { font-size:11px; padding:3px 8px; top:8px; left:8px; }
            .top-buttons { top:8px; right:8px; gap:4px; }
            .sticky-pool {
                margin: 0 -5px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="crt-overlay"></div>
    <div class="container" id="mainContainer">
        <div class="top-buttons">
            <button class="close-x-btn" id="closeBtn" title="离开">✕</button>
        </div>
        <button class="restart-btn" id="restartBtn" title="重新开始">🔄 重新开始</button>
        <div id="text-display"></div>
    </div>

    <script>
        // ---------- 全局变量 ----------
        const storyLines = [
            "你关闭了和她的聊天窗口。",
            "在黑暗之中，静静注视着眼前的空白文档。",
            "这个冗长、繁琐的故事，终于要结束了。",
            "你的双手悬停在键盘上，像每次结案后，准备写调查报告时一样。",
            "那么，来梳理这次的事件吧。",
            "就从7月9日开始。",
            "虽然它不是一切的开始，但它却是一切线索交汇的节点。"
        ];

        const displayArea = document.getElementById('text-display');
        const closeBtn = document.getElementById('closeBtn');
        const restartBtn = document.getElementById('restartBtn');

        let currentStep = 0;
        let currentStage = 'intro';
        let solvedStages = [];
        let bodyClickListener = null;

        // ---------- 进度存储 ----------
        function saveProgress(stage, solved) {
            localStorage.setItem('fenglaijingmeng_state', JSON.stringify({ stage, solved }));
        }
        function loadProgress() {
            const saved = localStorage.getItem('fenglaijingmeng_state');
            if (!saved) return false;
            try { const data = JSON.parse(saved); currentStage = data.stage; solvedStages = data.solved || []; return true; } catch(e) { return false; }
        }
        function clearProgress() {
            localStorage.removeItem('fenglaijingmeng_state');
            solvedStages = [];
            currentStage = 'intro';
            currentStep = 0;
        }
        function restartGame() {
            clearProgress();
            displayArea.innerHTML = '';
            restartBtn.style.display = 'none';
            appendNextLine();
        }
        restartBtn.addEventListener('click', () => { if (confirm('确定要重新开始吗？')) restartGame(); });

        function wrapQuestion(html) { return `<div class="question-block">${html}</div>`; }

        // ---------- 已解决问题的静态显示 ----------
        function renderSolvedStage(stage) {
            switch(stage) {
                case 'quiz_how_many': return wrapQuestion(`<div class="quiz-container"><div class="question">7月9日，在风来水榭旗下的游轮上，共发生了几起命案？</div><div class="options"><div class="option incorrect">A. 零起</div><div class="option incorrect">B. 一起</div><div class="option incorrect">C. 两起</div><div class="option correct">D. 三起</div><div class="option incorrect">E. 四起</div><div class="option incorrect">F. 五起</div></div></div>`);
                case 'drag_victims': return wrapQuestion(`<div class="quiz-container"><div class="question">最早发生的命案死者是 <span class="drop-zone filled">陈百惠</span>，<br>时间相近的两起命案死者是 <span class="drop-zone filled">季清越</span> 和 <span class="drop-zone filled">陈楚梦</span></div></div>`);
                case 'quiz_cause': return wrapQuestion(`<div class="quiz-container"><div class="question">先说陈百惠的案子。她的死因是？</div><div class="options"><div class="option incorrect">A. 饮酒过量</div><div class="option incorrect">B. 急病猝死</div><div class="option incorrect">C. 意外致死</div><div class="option incorrect">D. 窒息而死</div><div class="option correct">E. 中毒而死</div><div class="option incorrect">F. 击打致死</div></div></div>`);
                case 'quiz_why_poison': return wrapQuestion(`<div class="quiz-container"><div class="question">陈百惠看似饮酒过量引发了急病猝死，实际是中毒而死。因为船上的亚硝酸盐被人动过，且医务室未对陈百惠进行毒物检测。陈百惠为何会中毒？</div><div class="options"><div class="option incorrect">A. 误喝了有毒的酒水</div><div class="option correct">B. 被凶手主动毒杀</div></div></div>`);
                case 'quiz_motive': return wrapQuestion(`<div class="quiz-container"><div class="question">工作人员表对陈百惠的评价是：无烟酒等不良嗜好。陈百惠不会主动喝酒，她饮酒一定另有原因，很可能就与凶手有关。凶手为何要杀死陈百惠？</div><div class="options"><div class="option incorrect">A. 凶手与陈百惠有仇</div><div class="option incorrect">B. 陈百惠被凶手误杀</div><div class="option incorrect">C. 凶手无差别杀人</div><div class="option correct">D. 陈百惠是凶手共犯，凶手事后灭口</div></div></div>`);
                case 'quiz_where_help': return wrapQuestion(`<div class="quiz-container"><div class="question">陈百惠借助职务便利，在打扫哪个区域时协助了凶手？</div><div class="options"><div class="option incorrect">A. 宴会区</div><div class="option incorrect">B. 备餐区</div><div class="option correct">C. 酒水间</div><div class="option incorrect">D. 长廊</div></div></div>`);
                case 'drag_shuiyunting': return wrapQuestion(`<div class="quiz-container"><div class="question">酒水柜的脚垫被破坏了，从案发现场的地面也可看出，酒瓶摆放不符合工作要求，空酒瓶被摆在下面，有酒水的瓶子被摆在上面，造成重心不稳，促使酒倒塌。这也是为什么酒瓶们打碎后流出的酒液集中在前半部分。这些操作都发生在酒水间内。另外，陈百惠还曾经支走了同事，为凶手行方便。陈百惠添置的名贵护肤品说明她与凶手有金钱往来。除此之外，她与凶手还有另一层关系。在 <span class="drop-zone filled">水云庭</span> 找到的东西可以证明这一点。</div></div>`);
                case 'drag_murderer_and_victim': return wrapQuestion(`<div class="quiz-container"><div class="question">在水云庭中曾找到一张亲子鉴定书。陈百惠与凶手有母子关系，这也是凶手杀她的另一个原因。杀害陈百惠的凶手是 <span class="drop-zone filled">宋闻溪</span>，并借助陈百惠的协助杀害了 <span class="drop-zone filled">季清越</span>。</div></div>`);
                case 'quiz_wine_count': return wrapQuestion(`<div class="quiz-container"><div class="question">杀害季清越的凶器是定制红酒。定制红酒一共有几瓶？</div><div class="options"><div class="option incorrect">A. 一瓶</div><div class="option incorrect">B. 两瓶</div><div class="option correct">C. 三瓶</div><div class="option incorrect">D. 四瓶</div><div class="option incorrect">E. 无数瓶</div></div></div>`);
                case 'quiz_whose_wine': return wrapQuestion(`<div class="quiz-container"><div class="question">除了未婚夫妻房间各有一瓶定制红酒外，还有一瓶定制红酒被作为样品送给了鼎峰。杀死季清越的凶器，到底是谁的定制红酒？</div><div class="options"><div class="option incorrect">A. 宋令仪房间的酒</div><div class="option correct">B. 季清越房间的酒</div><div class="option incorrect">C. 鼎峰的样品酒</div></div></div>`);
                case 'quiz_swap_wine': return wrapQuestion(`<div class="quiz-container"><div class="question">如果杀死季清越的定制红酒是他自己房间里的酒，那么，目前在季清越房间的那瓶定制红酒其实是？</div><div class="options"><div class="option incorrect">A. 宋令仪房间的酒</div><div class="option incorrect">B. 季清越房间的酒</div><div class="option correct">C. 鼎峰的样品酒</div></div></div>`);
                case 'quiz_room_record': return wrapQuestion(`<div class="quiz-container"><div class="question">凶手是如何让鼎峰的样品酒出现在季清越房间的？以下哪条房卡记录能说明凶手的行踪？</div><div class="options"><div class="option incorrect">14:05 A301</div><div class="option incorrect">19:25 B301</div><div class="option incorrect">19:30 A302</div><div class="option correct">23:30 B302</div><div class="option incorrect">14:04 A303</div><div class="option incorrect">14:00 A304</div><div class="option incorrect">14:05 A305</div><div class="option incorrect">14:40 A305</div><div class="option incorrect">23:28 A305</div></div></div>`);
                case 'quiz_room_department': return wrapQuestion(`<div class="quiz-container"><div class="question">管理系统平台工作日志中，哪个部门留下的记录证明了凶手能够进入季清越房间？</div><div class="options"><div class="option incorrect">A.房卡管理组</div><div class="option incorrect">B.人事督查组</div><div class="option incorrect">C.物资管理组</div><div class="option correct">D.综合管理部</div></div></div>`);
                case 'drag_room_swap': return wrapQuestion(`<div class="quiz-container"><div class="question">从综合管理部的工作日志留言可知，曾有两张备用管理卡借出。凶手在晚上就是用备用卡打开季清越的房门，此举是为了把自己手中的样品酒放到季清越房间，伪装原本在那里的定制红酒。除凶手外，还有 <span class="drop-zone filled">陈楚梦</span> 也曾用备用卡进入过 <span class="drop-zone filled">宋令仪</span> 的房间。</div></div>`);
                case 'drag_timeline': return wrapQuestion(`<div class="quiz-container"><div class="question">案件的全貌……（时间表已填入正确答案）</div></div>`);
                case 'final_choice': return wrapQuestion(`<div class="quiz-container"><div class="question">以上——<br>就是全部了吗？</div><div class="options" style="grid-template-columns: repeat(2,1fr); max-width:300px;"><div class="option">A. 是的</div><div class="option correct">B. 不是</div></div></div>`);
                case 'chain_1': return wrapQuestion(`<div class="quiz-container"><div class="question">有一个人，尽管现在看上去光鲜亮丽，过去的罪孽却还没有赎清。
《韶光警方摧毁拐卖儿童犯罪团伙》这则报道中的某个受害者，其走失与某人有关。那个“某人”是 <span class="drop-zone filled">宋令仪</span></div></div>`);
                case 'chain_2': return wrapQuestion(`<div class="quiz-container"><div class="question">是宋令仪假借玩捉迷藏，促使宋闻溪被游荡的乞丐拐走的。但这就完了吗？还没有！她名不副实！首届金玉奖一等奖作品的原作者是 <span class="drop-zone filled">许故</span></div></div>`);
                case 'chain_3': return wrapQuestion(`<div class="quiz-container"><div class="question">是 <span class="drop-zone filled">唐镜玄</span> 把作品署名为宋令仪，帮助她参赛？</div></div>`);
                case 'chain_4': return wrapQuestion(`<div class="quiz-container"><div class="question">唐镜玄的辞职和 <span class="drop-zone filled">许故</span> 有关？</div></div>`);
                case 'love_hate': return wrapQuestion(`<div class="quiz-container"><div class="question">许故对宋令仪的感情到底是爱还是恨？</div><div class="options" style="grid-template-columns: repeat(3,1fr); max-width:400px;"><div class="option hate-option final-red">A. 恨</div><div class="option hate-option final-red">B. 恨</div><div class="option hate-option final-red">C. 恨</div></div></div>`);
                default: return '';
            }
        }

        // ---------- 追加题目 ----------
        function appendQuestion(stage) {
            const wrapper = document.createElement('div');
            wrapper.id = 'currentQuestion';
            wrapper.className = 'question-block';
            switch(stage) {
                case 'quiz_how_many':
                    wrapper.innerHTML = `<div class="quiz-container"><div class="question">7月9日，在风来水榭旗下的游轮上，共发生了几起命案？</div><div id="error-msg" class="error-msg">回答错误</div><div class="options" id="optionsWrapper"><div class="option" onclick="handleQuizAnswer('A','quiz_how_many','drag_victims')">A. 零起</div><div class="option" onclick="handleQuizAnswer('B','quiz_how_many','drag_victims')">B. 一起</div><div class="option" onclick="handleQuizAnswer('C','quiz_how_many','drag_victims')">C. 两起</div><div class="option" onclick="handleQuizAnswer('D','quiz_how_many','drag_victims')">D. 三起</div><div class="option" onclick="handleQuizAnswer('E','quiz_how_many','drag_victims')">E. 四起</div><div class="option" onclick="handleQuizAnswer('F','quiz_how_many','drag_victims')">F. 五起</div></div></div>`;

            options.forEach(o=>{o.style.borderColor='#4a5a6a';o.style.color='#b0c4d9'});
            const correctMap = {
                'quiz_how_many': 'D', 'quiz_cause': 'E', 'quiz_why_poison': 'B',
                'quiz_motive': 'D', 'quiz_where_help': 'C', 'quiz_wine_count': 'C',
                'quiz_whose_wine': 'B', 'quiz_swap_wine': 'C', 'quiz_room_record': 'D',

            else {

                setTimeout(()=>container.classList.remove('shake'),500);

        function initFillMechanic(zoneIds, poolId, correctAnswers, onSuccess, stageName, options = {}) {
            const zones = Array.isArray(zoneIds) ? zoneIds.map(id => document.getElementById(id)) : [document.getElementById(zoneIds)];
            const pool = document.getElementById(poolId);
            const errorMsg = document.getElementById('error-msg');
            let activeZone = null;
            const finalCorrect = Array.isArray(correctAnswers) ? correctAnswers : [correctAnswers];
            const filledData = new Array(zones.length).fill(null);
            const { unorderedGroups = [] } = options;

            function updateCheck() {
                if (filledData.every(v => v !== null)) {
                    let allCorrect = true;
                    const used = new Set();
                    for (const group of unorderedGroups) {
                        const groupVals = group.indices.map(i => filledData[i]);
                        const groupCorrects = group.indices.map(i => finalCorrect[i]);
                        const sortedVals = [...groupVals].sort();
                        const sortedCorrects = [...groupCorrects].sort();
                        if (sortedVals.join(',') !== sortedCorrects.join(',')) { allCorrect = false; break; }
                        group.indices.forEach(i => used.add(i));
                    }
                    for (let i = 0; i < finalCorrect.length; i++) {
                        if (used.has(i)) continue;
                        if (filledData[i] !== finalCorrect[i]) { allCorrect = false; break; }
                    }
                    if (allCorrect) {
                        errorMsg.style.display = 'none';
                        pool.querySelectorAll('.click-item').forEach(el => el.removeEventListener('click', onItemClick));
                        zones.forEach(z => { z.removeEventListener('click', onZoneClick); z.classList.remove('active'); });
                        document.removeEventListener('keydown', onKeyDown);
                        activeZone = null;
                        if (onSuccess) onSuccess();
                    } else {
                        errorMsg.style.display = 'block';
                    }
                } else {
                    errorMsg.style.display = 'none';
                }
            }

            function onZoneClick(e) {
                const target = e.currentTarget;
                const index = zones.indexOf(target);
                if (index === -1) return;
                if (activeZone === target) {
                    target.classList.remove('active');
                    activeZone = null;
                    return;
                }
                zones.forEach(z => z.classList.remove('active'));
                target.classList.add('active');
                activeZone = target;
            }

            function onItemClick(e) {
                if (!activeZone) return;
                const content = e.currentTarget.textContent.trim();
                const index = zones.indexOf(activeZone);
                if (index === -1) return;
                activeZone.textContent = content;
                if (!activeZone.classList.contains('filled')) activeZone.classList.add('filled');
                filledData[index] = content;
                activeZone.classList.remove('active');
                activeZone = null;
                updateCheck();
            }

            function onKeyDown(e) {
                if ((e.key === 'Backspace' || e.key === 'Delete') && activeZone && activeZone.textContent !== '') {
                    e.preventDefault();
                    const index = zones.indexOf(activeZone);
                    if (index !== -1 && filledData[index] !== null) {
                        activeZone.textContent = '';
                        activeZone.classList.remove('filled');
                        filledData[index] = null;
                        updateCheck();
                    }
                }
            }

            zones.forEach(z => { z.addEventListener('click', onZoneClick); });
            pool.querySelectorAll('.click-item').forEach(el => { el.addEventListener('click', onItemClick); });
            document.addEventListener('keydown', onKeyDown);
        }

        function renderLongStory() {
            restartBtn.style.display = 'block';
            const storyText = `<p class="story-text-block">真相已经很清晰了。</p>
            <p class="story-text-block">二十二年前，沈淡云生下了一对双胞胎女孩。她用一个男婴调换了双胞胎中的妹妹——也许是重男轻女，也许是为了讨宋远山欢心。她自认瞒得很好，却不知道男婴的母亲陈百惠悄悄留下了自己和男婴的亲子鉴定书。总之，前十五年，这对被分开的姐妹一直生活在两个世界中。</p>
            <p class="story-text-block">阴差阳错，十五年后，因为明德私立学校的特招生计划，姐姐宋令仪和妹妹陈楚梦竟在同一所学校相遇了。宋令仪因为从小不受重视，一直渴望关注，所以，她在学校总是试图引起别人注意。但她的炫耀、吹嘘只起到反作用，她几乎被全校厌恶。一些看不惯她又碍于家世不敢对她下手的人，将怒气发泄到了陈楚梦身上。</p>
            <p class="story-text-block">陈楚梦在愤怒、不甘和怀疑的驱使下，调查起自己的身世，最终，她发现了被藏起来的亲子鉴定书。陈百惠怕她惹事，就说“三个孩子的父亲都是宋远山”。这当然是谎言，因为宋闻溪不像宋远山及其女儿患有地中海贫血，而且血型和宋远山根本对不上。可陈楚梦相信了，她去找宋令仪摊牌，想调换两人的命运。</p>
            <p class="story-text-block">宋令仪不可能让另一个人回来分散母亲对自己的爱。激动之下，她将陈楚梦推下山崖。陈楚梦大概被山底的水流卷走，漂至晋山村，被村里的人当做“人牲”圈禁了四年。</p>
            <p class="story-text-block">陈楚梦出事的第二天，沈淡云就意外身亡。负罪感席卷了宋令仪——她大概把这当成了因果报应。总之，韶光彻底成了她的一块心病，她远走海外，四年都不敢回来。</p>
            <p class="story-text-block">四年后，鼎峰和阅辉争锋相对。两家打算联姻，以化干戈为玉帛。季清越察觉到宋令仪戴着华丽的假面，请侦探进行调查，得知了宋令仪学术不端的事情。他很可能把“自己知道鼎峰的把柄”的事透露了出去。</p>
            <p class="story-text-block">宋闻溪讨厌季清越的野心和张扬，他更讨厌有外人要来鼎峰分一杯羹。得知要联姻的消息后，他来到即将举行活祭仪式的晋山村，可能是想借此警醒自己，那却成了他和陈楚梦偶遇的契机。陈楚梦借那场大火逃了出来——因为火是从祠堂烧起来的，大概率也是她放的。宋闻溪以宋令仪的名义，将她安置在水云庭。</p>
            <p class="story-text-block">陈楚梦打算在订婚宴上报复宋令仪，她的原计划应该是用麻醉剂令宋令仪昏迷后，再从阳台将宋令仪丢进大海，自己取代宋令仪，因此，她穿了和宋令仪一样的白衣。然而，还没等她下手，惊慌的宋令仪就用酒瓶敲死了她。到最后，被丢下大海的反倒是她自己的尸体。</p>
            <p class="story-text-block">宋闻溪真的对陈楚梦的计划不知情吗？恐怕答案是否。想必他已经猜到了陈楚梦要做什么，并决心添一把火。他给陈楚梦指了一条“人迹罕至”的路去往宋令仪的房间，那条路正好经过长廊和宴会厅后门来到客房部。宋闻溪的计划恐怕就是让陈楚梦被目击者误认为宋令仪，成为接下来季清越死亡案的嫌疑人。这场姐妹相残中，无论活下来的是谁，都将因自己确实存在的杀人行为，而无法解释自己在季清越死亡时的行迹，给不出有力反驳，成为被他栽赃的最好人选。而且，他作为鼎峰的代表，一直在插手游轮的决策，为杀人案添砖加瓦。</p>
            <p class="story-text-block">他将自己摘出的办法是使用机关。订婚宴结束后，宴会厅被封闭，只有工作人员在里面打扫和布置。就是趁这个时候，他破坏了酒水柜的脚垫，又将有酒水的瓶子全部放在柜子上层，空瓶全部放在柜子下层，以此调整了红酒柜的重心。他知道，嗜好红酒的季清越必然提前来到酒柜旁，那时游轮正要穿过礁石带，造成的颠簸会让重心不稳的酒柜倒塌砸死了季清越——虽说实际操作中，是酒水柜上带有金属装饰的定制红酒先砸死了季清越，接着整个酒水柜再垮塌。季清越当天下午与宋闻溪发生过口角，因此晚上先回房取走自己的定制红酒，再来到酒水间。宋闻溪看到案发现场碎片堆里的金属装饰，又发现宋令仪房间里的定制红酒消失后，意识到可以借此嫁祸宋令仪，就在晚上用备用卡打开季清越的房门，把自己的样品定制红酒伪装成季清越房间的定制红酒，营造出“宋令仪用她的定制红酒砸死了季清越”的假象。</p>
            <p class="story-text-block">想要完成这个计划，不可或缺的助手就是游轮上的卫生保洁员：陈百惠。虽然亲子鉴定书随着陈楚梦一起失踪，但她还是借着鼎峰招聘员工的机会找上了宋闻溪，借两人的母子关系索要钱财。作为交换条件，宋闻溪让她支开其他保洁员，协助自己进入被封闭的宴会厅。之后，为了灭口，宋闻溪用提前从厨房取走的亚硝酸盐，毒死了陈百惠。</p>`;
            displayArea.innerHTML = `<div class="quiz-container" style="text-align: left;">${storyText}<span id="end-cursor" class="cursor" style="font-size: 2.6rem; color: #ff4d4d; text-shadow: 0 0 25px rgba(255, 77, 77, 0.9); display: inline-block; vertical-align: middle; margin-left: 6px;">▼</span></div>`;
            window.scrollTo(0, 0);
            currentStage = 'story_end';
            saveProgress(currentStage, solvedStages);

            const endCursor = document.getElementById('end-cursor');
            if (endCursor) {
                endCursor.addEventListener('click', function(e) {
                    e.stopPropagation();
                    displayArea.innerHTML = '';
                    currentStage = 'final_choice';
                    appendQuestion('final_choice');
                });
            }
        }

        function appendNextLine() {
            const oldCursor = document.querySelector('.cursor');
            if (oldCursor) oldCursor.remove();
            if (currentStep === 0) restartBtn.style.display = 'none';

                const lineDiv = document.createElement('div'); lineDiv.className = 'line'; lineDiv.textContent = storyLines[currentStep]; displayArea.appendChild(lineDiv);
                currentStep++;
                if (currentStep < storyLines.length) {
                    const cursorSpan = document.createElement('span'); cursorSpan.className = 'cursor'; cursorSpan.textContent = '▼'; displayArea.appendChild(cursorSpan);
                }
                window.scrollTo(0, document.body.scrollHeight);
                if (currentStep === storyLines.length) {
                    setTimeout(() => {
                        const finalCursor = document.querySelector('.cursor'); if (finalCursor) finalCursor.remove();
                        const btn = document.createElement('button'); btn.className = 'summary-btn'; btn.textContent = '开始梳理案情'; displayArea.appendChild(btn);
                        btn.addEventListener('click', (e) => { e.stopPropagation(); displayArea.innerHTML = ''; currentStage = 'quiz_how_many'; appendQuestion('quiz_how_many'); restartBtn.style.display = 'block'; saveProgress(currentStage, solvedStages); });

                    }, 400);
                }
                saveProgress('intro', solvedStages);
            }
        }

        function globalClickHandler(e) {
            if (e.target.closest('.cursor') || e.target.closest('.summary-btn') || e.target.closest('.option') || e.target.closest('.submit-fill-btn') || e.target.closest('.fill-input') || e.target.closest('.click-item') || e.target.closest('.drop-zone') || e.target.closest('.restart-btn') || e.target.closest('.close-x-btn')) return;
            if (currentStep >= storyLines.length) return;
            appendNextLine();
        }

        closeBtn.addEventListener('click', () => { window.location.href = 'wechat.html'; });

        document.addEventListener('DOMContentLoaded', () => {
            const hasSave = loadProgress();
            if (hasSave) {
                restartBtn.style.display = 'block';
                if (currentStage === 'intro') {
                    displayArea.innerHTML = '';
                    for (let i = 0; i < currentStep; i++) {
                        const l = document.createElement('div'); l.className = 'line'; l.textContent = storyLines[i]; displayArea.appendChild(l);
                    }
                    if (currentStep < storyLines.length) {
                        const c = document.createElement('span'); c.className = 'cursor'; c.textContent = '▼'; displayArea.appendChild(c);
                        restartBtn.style.display = 'none';
                        bodyClickListener = globalClickHandler;
                        document.body.addEventListener('click', bodyClickListener);
                    } else {
                        const btn = document.createElement('button'); btn.className = 'summary-btn'; btn.textContent = '开始梳理案情'; displayArea.appendChild(btn);
                        btn.addEventListener('click', (e) => { e.stopPropagation(); displayArea.innerHTML = ''; currentStage = 'quiz_how_many'; appendQuestion('quiz_how_many'); restartBtn.style.display = 'block'; saveProgress(currentStage, solvedStages); });
                    }
                } else if (currentStage === 'story_end') {
                    renderLongStory();
                } else if (currentStage === 'final_end') {
                    appendFinalButton();
                } else {
                    displayArea.innerHTML = '';
                    solvedStages.forEach(stage => { displayArea.insertAdjacentHTML('beforeend', renderSolvedStage(stage)); });
                    appendQuestion(currentStage);
                }
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                restartBtn.style.display = 'none';
                bodyClickListener = globalClickHandler;
                document.body.addEventListener('click', bodyClickListener);
                appendNextLine();
            }
        });
    </script>
