<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>风来惊梦 · 结局</title>
    <style>
        /* ---------- 全局与背景 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            color: #d1d5db;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('../images/bg.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.45) contrast(1.1) saturate(0.8);
            z-index: -2;
        }
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%),
                        repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
        }

        .container {
            width: 90%; max-width: 820px;
            height: 70vh; max-height: 550px;
            padding: 40px 50px;
            background: rgba(10, 15, 20, 0.6);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 100, 80, 0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; border-radius: 4px; overflow-y: auto;
            position: relative;
        }

        /* ---------- 右上角 X 按钮 ---------- */
        .close-x-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 22px;
            color: #6b7280;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: color 0.3s ease, transform 0.3s ease;
            z-index: 10;
            line-height: 1;
            padding: 4px 8px;
        }
        .close-x-btn:hover {
            color: #ff4d4d;
            transform: scale(1.1);
        }

        /* ---------- 右上角 历史卷宗按钮 ---------- */
        .history-btn {
            position: absolute;
            top: 12px;
            right: 58px;
            font-size: 16px;
            color: #b0c4d9;
            background: transparent;
            border: 1px solid rgba(150, 100, 80, 0.3);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
            z-index: 10;
            padding: 4px 10px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
        }
        .history-btn:hover {
            opacity: 1 !important;
            background: rgba(60, 80, 100, 0.5);
            border-color: #a45c5c;
            color: #ffffff;
        }
        .history-btn.visible {
            opacity: 0.7;
            pointer-events: auto;
        }

        #text-display { display: flex; flex-direction: column; gap: 12px; line-height: 1.8; font-size: 1.15rem; letter-spacing: 0.02em; text-align: left; min-height: 200px; }
        .line { opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards ease-out; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .cursor { display: inline-block; color: #a45c5c; animation: jumpBlink 1.2s infinite ease-in-out; user-select: none; }
        @keyframes jumpBlink { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-8px); opacity: 0.2; } }

        .summary-btn {
            margin-top: 25px; padding: 12px 30px; background: transparent; border: 1px solid #a45c5c; color: #e0c0c0;
            font-family: 'Courier New', Courier, monospace; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease;
            align-self: center; display: block; margin: 0 auto;
            box-shadow: 0 0 8px rgba(164, 92, 92, 0.2); letter-spacing: 2px;
        }
        .summary-btn:hover { background: rgba(164, 92, 92, 0.2); box-shadow: 0 0 20px rgba(164, 92, 92, 0.6); transform: scale(1.02); }

        /* ---------- 统一问卷容器 ---------- */
        .quiz-container { width: 100%; text-align: center; padding-top: 10px; }
        .question { font-size: 1.3rem; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; line-height: 2.0; }
        .hint-text { font-size: 0.8rem; color: #9ca3af; margin: 2px 0 15px 0; letter-spacing: 0.5px; opacity: 0.7; }

        .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: 15px auto 20px auto; }
        .option {
            background: rgba(30, 40, 50, 0.7); border: 1px solid #4a5a6a; border-radius: 4px;
            padding: 12px 10px; font-size: 1.05rem; color: #b0c4d9; cursor: pointer;
            text-align: center; user-select: none; display: flex; justify-content: center; align-items: center; word-break: keep-all;
            transition: opacity 0.2s ease, background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
        }
        .option:hover { background: rgba(60, 80, 100, 0.5); border-color: #a45c5c; color: #ffffff; transform: translateY(-2px); }

        #error-msg { color: #ff4d4d; font-weight: bold; font-size: 1.2rem; margin-top: 15px; text-align: center; display: none; letter-spacing: 3px; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }
        .shake { animation: shake 0.5s ease-in-out; }

        .fill-input {
            background: rgba(10, 15, 20, 0.6); border: 1px solid #4a5a6a; border-radius: 4px;
            padding: 8px 12px; font-size: 1.1rem; color: #d1d5db; width: 140px; text-align: center;
            font-family: 'Courier New', Courier, monospace; outline: none; transition: border 0.3s;
        }
        .fill-input:focus { border-color: #a45c5c; }
        .fill-input.error { border-color: #ff4d4d; color: #ff4d4d; }
        .submit-fill-btn {
            margin-top: 20px; padding: 8px 25px; background: transparent; border: 1px solid #a45c5c; color: #e0c0c0;
            font-family: 'Courier New', Courier, monospace; font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
        }
        .submit-fill-btn:hover { background: rgba(164, 92, 92, 0.2); box-shadow: 0 0 15px rgba(164, 92, 92, 0.4); }

        /* ---------- 点击式填空样式 ---------- */
        .pool-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 15px 0; }
        .click-item {
            background: rgba(40, 50, 60, 0.8); border: 1px solid #5a6a7a; border-radius: 4px;
            padding: 8px 15px; font-size: 1.05rem; color: #d1d5db; cursor: pointer; touch-action: auto;
            transition: all 0.2s; user-select: none;
        }
        .click-item:active { transform: scale(0.95); background: rgba(60, 80, 100, 0.5); }

        .drop-zone {
            display: inline-block;
            min-width: 100px;
            padding: 18px 10px 6px 10px;
            margin: 6px 14px;
            border-bottom: 2px solid #a45c5c;
            color: #a45c5c;
            font-weight: bold;
            background: rgba(20, 30, 40, 0.5);
            border-radius: 2px;
            transition: all 0.2s;
            cursor: pointer;
            vertical-align: bottom;
        }
        .drop-zone.active { border-color: #fff; background: rgba(164, 92, 92, 0.4); box-shadow: 0 0 10px rgba(164, 92, 92, 0.3); }
        .drop-zone.filled { border-color: #4caf50; color: #4caf50; }

        /* ---------- 长段剧情特殊排版 ---------- */
        .story-text-block {
            text-align: justify;
            text-indent: 2em;
            font-size: 1.1rem;
            line-height: 1.9;
            margin-bottom: 10px;
        }

        /* ---------- 爱与恨的特殊逻辑样式 ---------- */
        .love-option { transition: all 0.3s ease; }
        .love-option.freeze { pointer-events: none; }
        .love-option.shake-red {
            animation: shake 0.5s ease-in-out;
            color: #ff4d4d !important;
            border-color: #ff4d4d !important;
            background: rgba(255, 77, 77, 0.1);
        }
        .hate-option.final-red {
            color: #ff4d4d !important;
            border-color: #ff4d4d !important;
            background: rgba(255, 77, 77, 0.15) !important;
        }

        /* ---------- 移动端适配 ---------- */
        @media (max-width: 640px) {
            .container { padding: 20px 15px; height: 80vh; max-height: none; }
            #text-display { font-size: 1rem; gap: 8px; }
            .options { grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 100%; }
            .option { font-size: 0.95rem; padding: 10px 8px; }
            .question { font-size: 1.15rem; line-height: 1.8; }
            .fill-input { width: 90px; font-size: 1rem; }
            .pool-container { gap: 6px; }
            .click-item { font-size: 0.9rem; padding: 6px 10px; }
            .drop-zone { min-width: 70px; padding: 14px 4px 4px 4px; margin: 4px 4px; font-size: 0.95rem; }
            .hint-text { font-size: 0.7rem; }
            .close-x-btn { top: 8px; right: 10px; font-size: 18px; }
            .history-btn { top: 8px; right: 48px; font-size: 12px; padding: 4px 8px; }
        }
        @media (max-width: 400px) {
            .fill-input { width: 70px; font-size: 0.9rem; }
            .question { font-size: 1rem; }
        }

        /* ============================================
           历史记录弹窗样式（独立于游戏主流程）
           ============================================ */
        .history-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }
        .history-overlay.active {
            display: flex;
        }
        .history-modal {
            width: 90%;
            max-width: 650px;
            max-height: 80%;
            background: rgba(20, 30, 40, 0.95);
            border: 1px solid rgba(150, 100, 80, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border-radius: 6px;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(150, 100, 80, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .history-header h2 {
            font-size: 1.2rem;
            color: #e0c0c0;
            letter-spacing: 2px;
        }
        .history-close-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .history-close-btn:hover {
            color: #ff4d4d;
        }
        .history-list {
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* 历史记录中的条目样式 */
        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #a45c5c;
            font-size: 0.95rem;
            pointer-events: none;
        }
        .history-item .question {
            font-size: 1rem;
            margin-bottom: 8px;
            text-align: left;
            color: #d1d5db;
            line-height: 1.6;
        }
        .history-item .fill-input {
            background: rgba(10, 15, 20, 0.4);
            border-color: #4caf50;
            color: #4caf50;
            opacity: 0.9;
            pointer-events: none !important;
        }
        .history-item .option.correct-answer {
            border-color: #4caf50;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.15);
            pointer-events: none !important;
        }
        .history-item .hate-option.final-red {
            color: #ff4d4d !important;
            border-color: #ff4d4d !important;
            background: rgba(255, 77, 77, 0.15) !important;
            pointer-events: none !important;
        }
        /* 滚动条样式 */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: #a45c5c; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="crt-overlay"></div>
    <div class="container" id="mainContainer">
        <button class="close-x-btn" id="closeBtn" title="离开">✕</button>
        <button class="history-btn" id="historyBtn" title="查看已完成的卷宗">📜 卷宗</button>
        <div id="text-display"></div>

        <!-- 历史记录弹窗 -->
        <div class="history-overlay" id="historyOverlay">
            <div class="history-modal">
                <div class="history-header">
                    <h2>📜 梳理卷宗</h2>
                    <button class="history-close-btn" id="historyCloseBtn">✕</button>
                </div>
                <div class="history-list" id="historyList">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- 状态与数据 ----------
        const storyLines = [
            "你关闭了和她的聊天窗口。",
            "在黑暗之中，静静注视着眼前的空白文档。",
            "——这个冗长、繁琐的故事，终于要结束了。",
            "你的双手悬停在键盘上，像每次结案后，准备写调查报告时一样。",
            "那么，来梳理这次的事件吧。",
            "就从7月9日开始。",
            "虽然它不是一切的开始，但它却是一切线索交汇的节点。"
        ];

        const displayArea = document.getElementById('text-display');
        const closeBtn = document.getElementById('closeBtn');
        const historyBtn = document.getElementById('historyBtn');
        const historyOverlay = document.getElementById('historyOverlay');
        const historyCloseBtn = document.getElementById('historyCloseBtn');
        const historyList = document.getElementById('historyList');

        let currentStep = 0;
        let currentStage = 'intro';

        // ---------- 历史记录机制（使用预置模板，确保显示正确答案） ----------
        let historyOrder = [];     // 记录已完成步骤的 stage 名称
        // 预置所有阶段对应的卷宗 HTML（已填入正确答案和选中状态）
        const historyTemplates = {
            'quiz1': `
                <div class="quiz-container">
                    <div class="question">7月9日，在风来水榭旗下的游轮上，共发生了几起命案？</div>
                    <div class="options">
                        <div class="option">A. 零起</div>
                        <div class="option">B. 一起</div>
                        <div class="option">C. 两起</div>
                        <div class="option correct-answer">D. 三起</div>
                        <div class="option">E. 四起</div>
                        <div class="option">F. 五起</div>
                    </div>
                </div>
            `,
            'fill1': `
                <div class="quiz-container">
                    <div class="question">
                        最早发生的命案死者是 <input type="text" class="fill-input" value="陈百惠" readonly>，<br>
                        时间相近的两起命案死者是 <input type="text" class="fill-input" value="季清越" readonly> 和 <input type="text" class="fill-input" value="陈楚梦" readonly>
                    </div>
                </div>
            `,
            'quiz2': `
                <div class="quiz-container">
                    <div class="question">先说陈百惠的案子。她的死因是？</div>
                    <div class="options">
                        <div class="option">A. 急病猝死</div>
                        <div class="option">B. 意外致死</div>
                        <div class="option">C. 窒息而死</div>
                        <div class="option">D. 击打致死</div>
                        <div class="option correct-answer">E. 中毒而死</div>
                        <div class="option">F. 失血过多</div>
                    </div>
                </div>
            `,
            'fill2': `
                <div class="quiz-container">
                    <div class="question">
                        杀害陈百惠的凶手是 <input type="text" class="fill-input" value="宋闻溪" readonly>
                    </div>
                </div>
            `,
            'drag1': `
                <div class="quiz-container">
                    <div class="question">宋闻溪杀害她的动机，与在 <span class="drop-zone filled">水云庭</span> 里找到的东西有关？</div>
                </div>
            `,
            'fill3': `
                <div class="quiz-container">
                    <div class="question">
                        杀害季清越的凶手是 <input type="text" class="fill-input" value="宋闻溪" readonly>
                    </div>
                </div>
            `,
            'drag2': `
                <div class="quiz-container">
                    <div class="question">
                        宋闻溪是如何在有不在场证明的情况下杀死季清越的？<br><br>
                        当天上午，季清越用 <span class="drop-zone filled">红酒柜</span> 放置他运来的 <span class="drop-zone filled">红酒</span>。<br><br>
                        晚上，季清越独自来到 <span class="drop-zone filled">宴会厅</span> 时，因 <span class="drop-zone filled">礁石带</span> 的影响，<span class="drop-zone filled">红酒柜</span> 砸死了季清越。<br><br>
                        工作人员目击到的“订婚宴女主人”，其实是 <span class="drop-zone filled">陈楚梦</span>
                    </div>
                </div>
            `,
            'story_end': `
                <div class="quiz-container" style="text-align: left;">
                    <p class="story-text-block">真相已经很清晰了。</p>
                    <p class="story-text-block">二十二年前，沈淡云生下了一对双胞胎女孩。她用一个男婴调换了双胞胎中的妹妹——也许是重男轻女，也许是为了讨宋远山欢心。她自认瞒得很好，却不知道男婴的母亲陈百惠悄悄留下了自己和男婴的亲子鉴定书。总之，前十五年，这对被分开的姐妹一直生活在两个世界中。</p>
                    <p class="story-text-block">阴差阳错，十五年后，因为明德私立学校的特招生计划，姐姐宋令仪和妹妹陈楚梦竟在同一所学校相遇了。宋令仪因为从小不受重视，一直渴望关注，所以，她在学校总是试图引起别人注意。但她的炫耀、吹嘘只起到反作用，她几乎被全校厌恶。一些看不惯她又碍于家世不敢对她下手的人，将怒气发泄到了陈楚梦身上。</p>
                    <p class="story-text-block">陈楚梦在愤怒、不甘和怀疑的驱使下，调查起自己的身世，最终，她发现了被藏起来的亲子鉴定书。陈百惠怕她惹事，就说“三个孩子的父亲都是宋远山”。这当然是谎言，因为宋闻溪不像宋远山及其女儿患有地中海贫血，而且血型和宋远山根本对不上。可陈楚梦相信了，她去找宋令仪摊牌，想调换两人的命运。</p>
                    <p class="story-text-block">宋令仪不可能让另一个人回来分散母亲对自己的爱。激动之下，她将陈楚梦推下山崖。陈楚梦大概被山底的水流卷走，漂至晋山村，被村里的人当做“人牲”圈禁了四年。</p>
                    <p class="story-text-block">陈楚梦出事的第二天，沈淡云就意外身亡。负罪感席卷了宋令仪——她大概把这当成了因果报应。总之，韶光彻底成了她的一块心病，她远走海外，四年都不敢回来。</p>
                    <p class="story-text-block">四年后，鼎峰和阅辉争锋相对。两家打算联姻，以化干戈为玉帛。宋闻溪讨厌季清越的野心和张扬，他更讨厌有外人要来鼎峰分一杯羹。他来到即将举行活祭仪式的晋山村，可能是想借此警醒自己，那却成了他和陈楚梦偶遇的契机。陈楚梦借那场大火逃了出来——因为火是从祠堂烧起来的，大概率也是她放的。宋闻溪以宋令仪的名义，将她安置在水云庭。</p>
                    <p class="story-text-block">陈楚梦打算在订婚宴上报复宋令仪，她的原计划应该是用麻醉剂令宋令仪昏迷后，再从阳台将宋令仪丢进大海，自己取代宋令仪，因此，她穿了和宋令仪一样的白衣。然而，还没等她出手，惊慌的宋令仪就用酒瓶敲死了她。到最后，被丢下大海的反倒是她自己的尸体。</p>

                currentStep = state.step;

        // ==============================================
        // ========== 点击式填空引擎 ====================
        // ==============================================
        function initFillMechanic(zoneIds, poolId, correctAnswers, onSuccess, stageName) {
            const zones = Array.isArray(zoneIds) ? zoneIds.map(id => document.getElementById(id)) : [document.getElementById(zoneIds)];
            const pool = document.getElementById(poolId);
            const errorMsg = document.getElementById('error-msg');
            const container = document.getElementById('dragContainer1') || document.getElementById('dragContainer2');
            
            let activeZone = null;
            const finalCorrect = Array.isArray(correctAnswers) ? correctAnswers : [correctAnswers];
            const filledData = new Array(zones.length).fill(null);

            function updateCheck() {
                if (filledData.every(v => v !== null)) {
                    const allCorrect = filledData.every((val, idx) => val === finalCorrect[idx]);
                    if (allCorrect) {
                        errorMsg.style.display = 'none';
                        if (container) container.classList.remove('shake');
                        pool.querySelectorAll('.click-item').forEach(el => { el.removeEventListener('click', onItemClick); });
                        zones.forEach(z => { z.removeEventListener('click', onZoneClick); });
                        document.removeEventListener('keydown', onKeyDown);
                        takeSnapshot(stageName);
                        if (onSuccess) setTimeout(onSuccess, 300);
                    } else {
                        errorMsg.style.display = 'block';
                        if (container) container.classList.add('shake');
                        setTimeout(() => { if(container) container.classList.remove('shake'); }, 500);
                    }
                } else {
                    errorMsg.style.display = 'none';
                    if (container) container.classList.remove('shake');
                }
            }

            function onZoneClick(e) {
                const target = e.currentTarget;
                zones.forEach(z => z.classList.remove('active'));
                target.classList.add('active');
                activeZone = target;
            }

            function onItemClick(e) {
                if (!activeZone) return;
                const content = e.currentTarget.textContent.trim();
                const index = zones.indexOf(activeZone);

                if (filledData[index] !== null) {
                    activeZone.textContent = '';
                    activeZone.classList.remove('filled');
                    filledData[index] = null;
                }
                activeZone.textContent = content;
                activeZone.classList.add('filled');
                filledData[index] = content;
                updateCheck();
            }

            function onKeyDown(e) {
                if (e.key === 'Backspace' || e.key === 'Delete') {
                    if (activeZone && activeZone.textContent !== '') {
                        e.preventDefault();
                        const index = zones.indexOf(activeZone);
                        activeZone.textContent = '';
                        activeZone.classList.remove('filled');
                        filledData[index] = null;
                        updateCheck();
                    }
                }
            }

            zones.forEach(z => { z.removeEventListener('click', onZoneClick); z.addEventListener('click', onZoneClick); });
            pool.querySelectorAll('.click-item').forEach(el => { el.removeEventListener('click', onItemClick); el.addEventListener('click', onItemClick); });
            document.removeEventListener('keydown', onKeyDown);
            document.addEventListener('keydown', onKeyDown);
        }

                    <div class="pool-container" id="pool2">${poolHTML}</div>
                </div>
            `;
            renderNewUI(html, 'drag2');
            initFillMechanic(['drop2_1','drop2_2','drop2_3','drop2_4','drop2_5','drop2_6'], 'pool2', 
                ['红酒柜','红酒','宴会厅','礁石带','红酒柜','陈楚梦'], 
                renderLongStory,
                'drag2'
            );
        }

        // ==============================================
        // ========== 第九阶段：长篇剧情展示 =============
        // ==============================================
        function renderLongStory() {
            const storyText = `
                <p class="story-text-block">真相已经很清晰了。</p>
                <p class="story-text-block">二十二年前，沈淡云生下了一对双胞胎女孩。她用一个男婴调换了双胞胎中的妹妹——也许是重男轻女，也许是为了讨宋远山欢心。她自认瞒得很好，却不知道男婴的母亲陈百惠悄悄留下了自己和男婴的亲子鉴定书。总之，前十五年，这对被分开的姐妹一直生活在两个世界中。</p>
                <p class="story-text-block">阴差阳错，十五年后，因为明德私立学校的特招生计划，姐姐宋令仪和妹妹陈楚梦竟在同一所学校相遇了。宋令仪因为从小不受重视，一直渴望关注，所以，她在学校总是试图引起别人注意。但她的炫耀、吹嘘只起到反作用，她几乎被全校厌恶。一些看不惯她又碍于家世不敢对她下手的人，将怒气发泄到了陈楚梦身上。</p>
                <p class="story-text-block">陈楚梦在愤怒、不甘和怀疑的驱使下，调查起自己的身世，最终，她发现了被藏起来的亲子鉴定书。陈百惠怕她惹事，就说“三个孩子的父亲都是宋远山”。这当然是谎言，因为宋闻溪不像宋远山及其女儿患有地中海贫血，而且血型和宋远山根本对不上。可陈楚梦相信了，她去找宋令仪摊牌，想调换两人的命运。</p>
                <p class="story-text-block">宋令仪不可能让另一个人回来分散母亲对自己的爱。激动之下，她将陈楚梦推下山崖。陈楚梦大概被山底的水流卷走，漂至晋山村，被村里的人当做“人牲”圈禁了四年。</p>
                <p class="story-text-block">陈楚梦出事的第二天，沈淡云就意外身亡。负罪感席卷了宋令仪——她大概把这当成了因果报应。总之，韶光彻底成了她的一块心病，她远走海外，四年都不敢回来。</p>
                <p class="story-text-block">四年后，鼎峰和阅辉争锋相对。两家打算联姻，以化干戈为玉帛。宋闻溪讨厌季清越的野心和张扬，他更讨厌有外人要来鼎峰分一杯羹。他来到即将举行活祭仪式的晋山村，可能是想借此警醒自己，那却成了他和陈楚梦偶遇的契机。陈楚梦借那场大火逃了出来——因为火是从祠堂烧起来的，大概率也是她放的。宋闻溪以宋令仪的名义，将她安置在水云庭。</p>
                <p class="story-text-block">陈楚梦打算在订婚宴上报复宋令仪，她的原计划应该是用麻醉剂令宋令仪昏迷后，再从阳台将宋令仪丢进大海，自己取代宋令仪，因此，她穿了和宋令仪一样的白衣。然而，还没等她出手，惊慌的宋令仪就用酒瓶敲死了她。到最后，被丢下大海的反倒是她自己的尸体。</p>
                <p class="story-text-block">宋闻溪真的对陈楚梦的计划不知情吗？恐怕答案是否。想必他已经猜到了陈楚梦要做什么，并决心添一把火。他给陈楚梦指了一条“人迹罕至”的路去往宋令仪的房间，那条路正好经过长廊和宴会厅后门来到客房部。宋闻溪的计划恐怕就是让陈楚梦被目击者误认为宋令仪，成为接下来季清越死亡案的嫌疑人。这场姐妹相残中，无论活下来的是谁，都将因自己确实存在的杀人行为，而支支吾吾，给不出有力反驳，成为被他栽赃的最好人选。</p>
                <p class="story-text-block">他将自己摘出的办法是使用机关。订婚宴结束后，宴会厅被封闭，只有工作人员在里面打扫和布置。就是趁这个时候，他调整了红酒柜的重心。他知道，嗜好红酒的季清越必然提前来到酒柜旁，而那时游轮正要穿过礁石带，造成的颠簸让重心不稳的红酒柜倒塌砸死了季清越。</p>
                <p class="story-text-block">想要完成这个计划，不可或缺的助手就是游轮上的卫生保洁员：陈百惠。虽然亲子鉴定书随着陈楚梦一起失踪，但她还是找上了宋闻溪，大概想借两人的母子关系索要钱财吧。作为交换条件，宋闻溪要她帮忙做手脚，或者让她协助自己进入被封闭的宴会厅。之后，为了灭口，宋闻溪毒死了陈百惠。</p>
            `;

            const html = `
                <div class="quiz-container" style="text-align: left;">
                    ${storyText}
                    <span id="end-cursor" class="cursor" style="font-size: 2.6rem; color: #ff4d4d; text-shadow: 0 0 25px rgba(255, 77, 77, 0.9); display: inline-block; vertical-align: middle; margin-left: 6px;">▼</span>
                </div>
            `;
            renderNewUI(html, 'story_end');
            takeSnapshot('story_end');
        }

        // ---------- 第十阶段：最终抉择（重构反馈） ----------
        function renderFinalChoice() {
            const html = `
                <div class="quiz-container" id="finalQuizContainer">
                    <div class="question">以上——<br>就是全部了吗？</div>
                    <div class="options" id="finalOptionsWrapper" style="grid-template-columns: repeat(2, 1fr); max-width: 300px;">
                        <div class="option" onclick="handleFinalAnswer('A')">A. 是的</div>
                        <div class="option" onclick="handleFinalAnswer('B')">B. 不是</div>
                    </div>
                    <div id="error-msg" class="error-msg"></div>
                </div>
            `;
            renderNewUI(html, 'final_choice');
        }

        // ---------- 最终选项逻辑 ----------
        window.handleFinalAnswer = function(answer) {
            const container = document.getElementById('finalQuizContainer');
            const errorMsg = document.getElementById('error-msg');
            const options = document.querySelectorAll('#finalOptionsWrapper .option');

            if (answer === 'A') {
                errorMsg.textContent = '回答错误';
                errorMsg.style.display = 'block';
                container.classList.add('shake');
                options.forEach(opt => {
                    if(opt.getAttribute('onclick').includes("'A'")) {
                        opt.style.borderColor = '#ff4d4d';
                        opt.style.color = '#ff4d4d';
                    }
                });
                setTimeout(() => { container.classList.remove('shake'); }, 500);
            } else if (answer === 'B') {
                errorMsg.style.display = 'none';
                container.classList.remove('shake');
                takeSnapshot('final_choice');
                renderNextChainQuestion1();
            }
        };

        // ==============================================
        // ========== 第十一阶段：后续剧情链 =============
        // ==============================================
        function renderNextChainQuestion1() {
            const html = `
                <div class="quiz-container" id="chainContainer1">
                    <div class="question">有一个人，还没有赎清曾经的罪孽。那个人是 <input type="text" class="fill-input" id="c1_1" placeholder="姓名"></div>
                    <div id="error-msg" class="error-msg">不对，再想想。</div>
                    <button class="submit-fill-btn" onclick="submitChain1()">确认</button>
                </div>
            `;
            renderNewUI(html, 'chain_1');
        }
        window.submitChain1 = function() {
            const i1 = document.getElementById('c1_1');
            const errorMsg = document.getElementById('error-msg');
            const container = document.getElementById('chainContainer1');
            container.classList.remove('shake');
            errorMsg.style.display = 'none';
            i1.classList.remove('error');

            if (i1.value.trim() === '宋令仪') {
                takeSnapshot('chain_1');
                renderNextChainQuestion2();
            } else {
                errorMsg.style.display = 'block';
                container.classList.add('shake');
                if(i1.value.trim() === '') i1.classList.add('error');
                setTimeout(() => { container.classList.remove('shake'); }, 500);
            }
        };

        function renderNextChainQuestion2() {
            const html = `
                <div class="quiz-container" id="chainContainer2">
                    <div class="question">还有一则新闻报道与宋令仪有关。那则新闻的标题是：《<input type="text" class="fill-input" id="c2_1" style="width:200px;" placeholder="标题">》</div>
                    <div id="error-msg" class="error-msg">标题不准确。</div>

                </div>

        }

                    <button class="submit-fill-btn" onclick="submitChain4()">确认</button>

        window.submitChain4 = function() {

        };

        function renderNextChainQuestion5() {

                <div class="quiz-container" id="chainContainer5">
                    <div class="question">唐镜玄的辞职和 <input type="text" class="fill-input" id="c5_1" placeholder="姓名"> 有关？</div>

                    <button class="submit-fill-btn" onclick="submitChain5()">确认</button>
                </div>

            renderNewUI(html, 'chain_5');

        window.submitChain5 = function() {

            i1.classList.remove('error');

            } else {

                container.classList.add('shake');

        // ==============================================
        // ========== 第十二阶段：爱恨抉择 ================
        // ==============================================
        let isLovePhase = true;

        function renderLoveHateDilemma() {
            isLovePhase = true;
            const html = `
                <div class="quiz-container" id="loveHateContainer">
                    <div class="question">许故对宋令仪的感情到底是爱还是恨？</div>
                    <div class="options" id="loveHateOptions" style="grid-template-columns: repeat(3, 1fr); max-width: 400px;">
                        <div class="option love-option" onclick="handleLovePhaseClick(this)">A. 爱</div>
                        <div class="option love-option" onclick="handleLovePhaseClick(this)">B. 爱</div>
                        <div class="option love-option" onclick="handleLovePhaseClick(this)">C. 爱</div>
                    </div>
                    <div id="error-msg" class="error-msg">回答错误</div>
                </div>
            `;
            renderNewUI(html, 'love_hate');
        }

        window.handleLovePhaseClick = function(element) {
            const container = document.getElementById('loveHateContainer');
            const errorMsg = document.getElementById('error-msg');
            
            if (isLovePhase) {
                isLovePhase = false;
                const loveOptions = document.querySelectorAll('.love-option');
                loveOptions.forEach(opt => {
                    opt.classList.add('freeze');
                    opt.classList.add('shake-red');
                });
                
                errorMsg.textContent = '回答错误';
                errorMsg.style.display = 'block';

                setTimeout(() => {
                    loveOptions.forEach(opt => {
                        opt.style.transition = 'opacity 1.2s ease-in-out';
                        opt.style.opacity = '0';
                    });
                    
                    setTimeout(() => {
                        const options = document.querySelectorAll('#loveHateOptions .option');
                        options.forEach((opt, index) => {
                            opt.classList.remove('shake-red', 'freeze');
                            opt.textContent = ['A. 恨', 'B. 恨', 'C. 恨'][index];
                            opt.className = 'option hate-option final-red';
                            opt.style.transition = 'opacity 1.2s ease-in-out';
                            opt.style.opacity = '1';
                            opt.onclick = function() { window.handleHatePhaseClick(this); };
                        });
                        document.getElementById('error-msg').style.display = 'none';
                    }, 1400);
                }, 1000);
            }
        };

        window.handleHatePhaseClick = function(element) {
            const container = document.getElementById('loveHateContainer');
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';
            container.classList.remove('shake');
            takeSnapshot('love_hate');
            renderFinalActionButton();
        };

        // ==============================================
        // ========== 第十三阶段：最终结局按钮 ============
        // ==============================================
        function renderFinalActionButton() {
            const html = `
                <div class="quiz-container" style="text-align: center;">
                    <div class="question" style="font-size: 1.6rem; margin-bottom: 30px; color: #e0c0c0;">现在，为一切画上句号吧。</div>
                    <button class="summary-btn" style="font-size: 1.3rem; padding: 16px 40px; border-color: #a45c5c; color: #e0c0c0; margin-top:10px;" onclick="window.location.href='afterstory1.html'">收集罪证，举报宋令仪</button>
                </div>
            `;
            renderNewUI(html, 'final_end');
        }

        // ---------- 监听点击以触发长剧情的下一步 ----------
        document.body.addEventListener('click', (e) => {
            const endCursor = document.getElementById('end-cursor');
            if (endCursor && !e.target.closest('.option') && !e.target.closest('.summary-btn') && !e.target.closest('.submit-fill-btn')) {
                if (endCursor) {
                    renderFinalChoice();
                }
                return;
            }

            if (e.target.closest('.cursor') || e.target.closest('.summary-btn') || e.target.closest('.option') || e.target.closest('.submit-fill-btn') || e.target.closest('.fill-input') || e.target.closest('.click-item') || e.target.closest('.drop-zone')) return;
            if (currentStep >= storyLines.length) return;
            appendNextLine();
        });

        // ---------- 右上角 X 按钮事件 ----------
        closeBtn.addEventListener('click', function() {
            sessionStorage.setItem('return_from_wechat', 'true');
            window.location.href = 'wechat.html';
        });

        // ---------- 初始化与读取存档 ----------
        document.addEventListener('DOMContentLoaded', () => {
            const returnFromWechat = sessionStorage.getItem('return_from_wechat');
            
            if (returnFromWechat) {
                const hasSave = loadGameState();
                if (hasSave) {
                    sessionStorage.removeItem('return_from_wechat');
                    
                    // 1. 优先恢复卷宗列表
                    loadHistoryState();
                    
                    switch (currentStage) {
                        case 'quiz1': renderQuiz1(); break;
                        case 'fill1': renderFillBlank1(); break;
                        case 'quiz2': renderQuiz2(); break;
                        case 'fill2': renderFillBlank2(); break;
                        case 'drag1': renderFillStage1(); break;
                        case 'fill3': renderFillBlank3(); break;
                        case 'drag2': renderComplexFill(); break;
                        case 'story_end': renderLongStory(); break;
                        case 'final_choice': renderFinalChoice(); break;
                        case 'chain_1': renderNextChainQuestion1(); break;
                        case 'chain_2': renderNextChainQuestion2(); break;
                        case 'chain_3': renderNextChainQuestion3(); break;
                        case 'chain_4': renderNextChainQuestion4(); break;
                        case 'chain_5': renderNextChainQuestion5(); break;
                        case 'love_hate': renderLoveHateDilemma(); break;
                        case 'final_end': renderFinalActionButton(); break;
                        default: 
                            const initialText = storyLines.slice(0, currentStep);
                            displayArea.innerHTML = '';
                            initialText.forEach((text, index) => {
                                const lineDiv = document.createElement('div');
                                lineDiv.className = 'line';
                                lineDiv.textContent = text;
                                displayArea.appendChild(lineDiv);
                            });
                            if (currentStep < storyLines.length) {
                                const cursorSpan = document.createElement('span');
                                cursorSpan.className = 'cursor';
                                cursorSpan.textContent = '▼';
                                displayArea.appendChild(cursorSpan);
                            } else {
                                const btn = document.createElement('button');
                                btn.className = 'summary-btn';
                                btn.textContent = '开始梳理案情';
                                displayArea.appendChild(btn);
                                btn.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    renderQuiz1();
                                });
                            }
                            break;
                    }
                    return;
                }
            }
            
            sessionStorage.removeItem('return_from_wechat');
            clearGameState();
            historyOrder = [];
            appendNextLine();
        });
    </script>
