<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>风来惊梦 · 结局</title>
    <style>
        /* ---------- 全局与背景 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            color: #d1d5db;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('../images/bg.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.45) contrast(1.1) saturate(0.8);
            z-index: -2;
        }
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%),
                        repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
        }
        .container {
            width: 90%; max-width: 820px;
            height: 70vh; max-height: 550px;
            padding: 40px 50px;
            background: rgba(10, 15, 20, 0.6);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 100, 80, 0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; border-radius: 4px; overflow-y: auto;
            position: relative;
        }
        .top-buttons {
            position: absolute;
            top: 12px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .close-x-btn {
            font-size: 22px;
            color: #6b7280;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: color 0.3s ease, transform 0.3s ease;
            line-height: 1;
            padding: 4px 8px;
        }
        .close-x-btn:hover {
            color: #ff4d4d;
            transform: scale(1.1);
        }
        .history-btn {
            font-size: 14px;
            color: #b0c4d9;
            background: transparent;
            border: 1px solid rgba(150, 100, 80, 0.3);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
            padding: 4px 10px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
        }
        .history-btn:hover {
            opacity: 1 !important;
            background: rgba(60, 80, 100, 0.5);
            border-color: #a45c5c;
            color: #ffffff;
        }
        .history-btn.visible {
            opacity: 0.7;
            pointer-events: auto;
        }
        .restart-btn {
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 13px;
            color: #8a9aa8;
            background: rgba(30, 40, 50, 0.5);
            border: 1px solid rgba(120, 130, 140, 0.3);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 10;
        }
        .restart-btn:hover {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.5);
            background: rgba(60, 30, 30, 0.5);
        }
        #text-display { display: flex; flex-direction: column; gap: 12px; line-height: 1.8; font-size: 1.15rem; letter-spacing: 0.02em; text-align: left; min-height: 200px; }
        .line { opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards ease-out; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .cursor { display: inline-block; color: #a45c5c; animation: jumpBlink 1.2s infinite ease-in-out; user-select: none; }
        @keyframes jumpBlink { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-8px); opacity: 0.2; } }
        .summary-btn {
            margin-top: 25px; padding: 12px 30px; background: transparent; border: 1px solid #a45c5c; color: #e0c0c0;
            font-family: 'Courier New', Courier, monospace; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease;
            align-self: center; display: block; margin: 0 auto;
            box-shadow: 0 0 8px rgba(164, 92, 92, 0.2); letter-spacing: 2px;
        }
        .summary-btn:hover { background: rgba(164, 92, 92, 0.2); box-shadow: 0 0 20px rgba(164, 92, 92, 0.6); transform: scale(1.02); }
        .quiz-container { width: 100%; text-align: center; padding-top: 10px; }
        .question { font-size: 1.3rem; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; line-height: 2.0; }
        .hint-text { font-size: 0.8rem; color: #9ca3af; margin: 2px 0 15px 0; letter-spacing: 0.5px; opacity: 0.7; }
        .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: 15px auto 20px auto; }
        .option {
            background: rgba(30, 40, 50, 0.7); border: 1px solid #4a5a6a; border-radius: 4px;
            padding: 12px 10px; font-size: 1.05rem; color: #b0c4d9; cursor: pointer;
            text-align: center; user-select: none; display: flex; justify-content: center; align-items: center; word-break: keep-all;
            transition: opacity 0.2s ease, background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
        }
        .option:hover { background: rgba(60, 80, 100, 0.5); border-color: #a45c5c; color: #ffffff; transform: translateY(-2px); }
        #error-msg { color: #ff4d4d; font-weight: bold; font-size: 1.2rem; margin-top: 15px; text-align: center; display: none; letter-spacing: 3px; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }
        .shake { animation: shake 0.5s ease-in-out; }
        .fill-input {
            background: rgba(10, 15, 20, 0.6); border: 1px solid #4a5a6a; border-radius: 4px;
            padding: 8px 12px; font-size: 1.1rem; color: #d1d5db; width: 140px; text-align: center;
            font-family: 'Courier New', Courier, monospace; outline: none; transition: border 0.3s;
        }
        .fill-input:focus { border-color: #a45c5c; }
        .fill-input.error { border-color: #ff4d4d; color: #ff4d4d; }
        .submit-fill-btn {
            margin-top: 20px; padding: 8px 25px; background: transparent; border: 1px solid #a45c5c; color: #e0c0c0;
            font-family: 'Courier New', Courier, monospace; font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
        }
        .submit-fill-btn:hover { background: rgba(164, 92, 92, 0.2); box-shadow: 0 0 15px rgba(164, 92, 92, 0.4); }
        .pool-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 15px 0; }
        .click-item {
            background: rgba(40, 50, 60, 0.8); border: 1px solid #5a6a7a; border-radius: 4px;
            padding: 8px 15px; font-size: 1.05rem; color: #d1d5db; cursor: pointer; touch-action: auto;
            transition: all 0.2s; user-select: none;
        }
        .click-item:active { transform: scale(0.95); background: rgba(60, 80, 100, 0.5); }
        .drop-zone {
            display: inline-block;
            min-width: 100px;
            padding: 18px 10px 6px 10px;
            margin: 6px 14px;
            border-bottom: 2px solid #a45c5c;
            color: #a45c5c;
            font-weight: bold;
            background: rgba(20, 30, 40, 0.5);
            border-radius: 2px;
            transition: all 0.2s;
            cursor: pointer;
            vertical-align: bottom;
        }
        .drop-zone.active { border-color: #fff; background: rgba(164, 92, 92, 0.4); box-shadow: 0 0 10px rgba(164, 92, 92, 0.3); }
        .drop-zone.filled { border-color: #4caf50; color: #4caf50; }
        .story-text-block {
            text-align: justify;
            text-indent: 2em;
            font-size: 1.1rem;
            line-height: 1.9;
            margin-bottom: 10px;
        }
        .love-option { transition: all 0.3s ease; }
        .love-option.freeze { pointer-events: none; }
        .love-option.shake-red {
            animation: shake 0.5s ease-in-out;
            color: #ff4d4d !important;
            border-color: #ff4d4d !important;
            background: rgba(255, 77, 77, 0.1);
        }
        .hate-option.final-red {
            color: #ff4d4d !important;
            border-color: #ff4d4d !important;
            background: rgba(255, 77, 77, 0.15) !important;
        }
        @media (max-width: 640px) {
            .container { padding: 20px 15px; height: 80vh; max-height: none; }
            #text-display { font-size: 1rem; gap: 8px; }
            .options { grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 100%; }
            .option { font-size: 0.95rem; padding: 10px 8px; }
            .question { font-size: 1.15rem; line-height: 1.8; }
            .fill-input { width: 90px; font-size: 1rem; }
            .pool-container { gap: 6px; }
            .click-item { font-size: 0.85rem; padding: 6px 10px; }
            .drop-zone { min-width: 70px; padding: 14px 4px 4px 4px; margin: 4px 4px; font-size: 0.95rem; }
            .hint-text { font-size: 0.7rem; }
            .close-x-btn { font-size: 18px; }
            .history-btn { font-size: 12px; padding: 4px 8px; }
            .restart-btn { font-size: 11px; padding: 3px 8px; top: 8px; left: 8px; }
            .top-buttons { top: 8px; right: 8px; gap: 4px; }
        }
        @media (max-width: 400px) {
            .fill-input { width: 70px; font-size: 0.9rem; }
            .question { font-size: 1rem; }
        }
        .history-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }
        .history-overlay.active { display: flex; }
        .history-modal {
            width: 90%; max-width: 650px; max-height: 80%;
            background: rgba(20, 30, 40, 0.95);
            border: 1px solid rgba(150, 100, 80, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border-radius: 6px;
            padding: 20px 30px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .history-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(150, 100, 80, 0.3);
            padding-bottom: 12px; margin-bottom: 15px; flex-shrink: 0;
        }
        .history-header h2 { font-size: 1.2rem; color: #e0c0c0; letter-spacing: 2px; }
        .history-close-btn { background: transparent; border: none; color: #6b7280; font-size: 24px; cursor: pointer; transition: color 0.3s; }
        .history-close-btn:hover { color: #ff4d4d; }
        .history-list { overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 15px; }
        .history-item {
            background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 4px;
            border-left: 3px solid #a45c5c; font-size: 0.95rem; pointer-events: none;
        }
        .history-item .question { font-size: 1rem; margin-bottom: 8px; text-align: left; color: #d1d5db; line-height: 1.6; }
        .history-item .fill-input { background: rgba(10, 15, 20, 0.4); border-color: #4caf50; color: #4caf50; opacity: 0.9; pointer-events: none !important; }
        .history-item .option.correct-answer { border-color: #4caf50; color: #4caf50; background: rgba(76, 175, 80, 0.15); pointer-events: none !important; }
        .history-item .hate-option.final-red { color: #ff4d4d !important; border-color: #ff4d4d !important; background: rgba(255, 77, 77, 0.15) !important; pointer-events: none !important; }
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: #a45c5c; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="crt-overlay"></div>
    <div class="container" id="mainContainer">
        <div class="top-buttons">
            <button class="history-btn" id="historyBtn" title="查看已完成的卷宗">📜 卷宗</button>
            <button class="close-x-btn" id="closeBtn" title="离开">✕</button>
        </div>
        <button class="restart-btn" id="restartBtn" title="重新开始">🔄 重新开始</button>
        <div id="text-display"></div>
        <div class="history-overlay" id="historyOverlay">
            <div class="history-modal">
                <div class="history-header">
                    <h2>📜 梳理卷宗</h2>
                    <button class="history-close-btn" id="historyCloseBtn">✕</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        const storyLines = [
            "你关闭了和她的聊天窗口。",
            "在黑暗之中，静静注视着眼前的空白文档。",
            "——这个冗长、繁琐的故事，终于要结束了。",
            "你的双手悬停在键盘上，像每次结案后，准备写调查报告时一样。",
            "那么，来梳理这次的事件吧。",
            "就从7月9日开始。",
            "虽然它不是一切的开始，但它却是一切线索交汇的节点。"
        ];

        const displayArea = document.getElementById('text-display');
        const closeBtn = document.getElementById('closeBtn');
        const restartBtn = document.getElementById('restartBtn');
        const historyBtn = document.getElementById('historyBtn');
        const historyOverlay = document.getElementById('historyOverlay');
        const historyCloseBtn = document.getElementById('historyCloseBtn');
        const historyList = document.getElementById('historyList');

        let currentStep = 0;
        let currentStage = 'intro';
        let historyOrder = [];

        const historyTemplates = {
            'quiz1': `<div class="quiz-container"><div class="question">7月9日，在风来水榭旗下的游轮上，共发生了几起命案？</div><div class="options"><div class="option">A. 零起</div><div class="option">B. 一起</div><div class="option">C. 两起</div><div class="option correct-answer">D. 三起</div><div class="option">E. 四起</div><div class="option">F. 五起</div></div></div>`,
            'fill1': `<div class="quiz-container"><div class="question">最早发生的命案死者是 <input type="text" class="fill-input" value="陈百惠" readonly>，<br>时间相近的两起命案死者是 <input type="text" class="fill-input" value="季清越" readonly> 和 <input type="text" class="fill-input" value="陈楚梦" readonly></div></div>`,
            'quiz2': `<div class="quiz-container"><div class="question">先说陈百惠的案子。她的死因是？</div><div class="options"><div class="option">A. 急病猝死</div><div class="option">B. 意外致死</div><div class="option">C. 窒息而死</div><div class="option">D. 击打致死</div><div class="option correct-answer">E. 中毒而死</div><div class="option">F. 失血过多</div></div></div>`,
            'fill2': `<div class="quiz-container"><div class="question">杀害陈百惠的凶手是 <input type="text" class="fill-input" value="宋闻溪" readonly></div></div>`,
            'drag1': `<div class="quiz-container"><div class="question">宋闻溪杀害她的动机，与在 <span class="drop-zone filled">水云庭</span> 里找到的东西有关？</div></div>`,
            'fill3': `<div class="quiz-container"><div class="question">杀害季清越的凶手是 <input type="text" class="fill-input" value="宋闻溪" readonly></div></div>`,
            'drag2': `<div class="quiz-container"><div class="question">宋闻溪是如何在有不在场证明的情况下杀死季清越的？<br><br>当天上午，季清越用 <span class="drop-zone filled">红酒柜</span> 放置他运来的 <span class="drop-zone filled">红酒</span>。<br><br>晚上，季清越独自来到 <span class="drop-zone filled">宴会厅</span> 时，因 <span class="drop-zone filled">礁石带</span> 的影响，<span class="drop-zone filled">红酒柜</span> 砸死了季清越。<br><br>工作人员目击到的"订婚宴女主人"，其实是 <span class="drop-zone filled">陈楚梦</span></div></div>`,
            'story_end': `<div class="quiz-container" style="text-align: left;"><p class="story-text-block">真相已经很清晰了。</p></div>`,
            'final_choice': `<div class="quiz-container"><div class="question">以上——<br>就是全部了吗？</div><div class="options" style="grid-template-columns: repeat(2, 1fr); max-width: 300px;"><div class="option">A. 是的</div><div class="option correct-answer">B. 不是</div></div></div>`,
            'chain_1': `<div class="quiz-container"><div class="question">有一个人，还没有赎清曾经的罪孽。那个人是 <input type="text" class="fill-input" value="宋令仪" readonly></div></div>`,
            'chain_2': `<div class="quiz-container"><div class="question">还有一则新闻报道与宋令仪有关。那则新闻的标题是：《<span class="drop-zone filled">韶光警方摧毁拐卖儿童犯罪团伙</span>》</div></div>`,
            'chain_3': `<div class="quiz-container"><div class="question">首届金玉奖一等奖作品的原作者是 <input type="text" class="fill-input" value="许故" readonly></div></div>`,
            'chain_4': `<div class="quiz-container"><div class="question">是 <input type="text" class="fill-input" value="唐镜玄" readonly> 把作品署名为宋令仪，帮助她参赛？</div></div>`,
            'chain_5': `<div class="quiz-container"><div class="question">唐镜玄的辞职和 <input type="text" class="fill-input" value="许故" readonly> 有关？</div></div>`,
            'love_hate': `<div class="quiz-container"><div class="question">许故对宋令仪的感情到底是爱还是恨？</div><div class="options" style="grid-template-columns: repeat(3, 1fr); max-width: 400px;"><div class="option hate-option final-red">A. 恨</div><div class="option hate-option final-red">B. 恨</div><div class="option hate-option final-red">C. 恨</div></div></div>`
        };

        function saveHistoryState() {
            localStorage.setItem('fenglaijingmeng_history', JSON.stringify(historyOrder));
        }
        function loadHistoryState() {
            const saved = localStorage.getItem('fenglaijingmeng_history');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) { historyOrder = parsed; if (historyOrder.length > 0) historyBtn.classList.add('visible'); }
                } catch (e) {}
            }
        }
        function saveGameState(stage, step) {
            currentStage = stage;
            currentStep = step;
            localStorage.setItem('fenglaijingmeng_state', JSON.stringify({ stage, step }));
        }
        function loadGameState() {
            const saved = localStorage.getItem('fenglaijingmeng_state');
            if (!saved) return false;
            try {
                const state = JSON.parse(saved);
                currentStage = state.stage;
                currentStep = state.step;
                return true;
            } catch (e) { return false; }
        }
        function clearGameState() {
            localStorage.removeItem('fenglaijingmeng_state');
            localStorage.removeItem('fenglaijingmeng_history');
            historyOrder = [];
            historyBtn.classList.remove('visible');
        }

        function restartGame() {
            clearGameState();
            currentStep = 0;
            currentStage = 'intro';
            displayArea.innerHTML = '';
            restartBtn.style.display = 'none';
            appendNextLine();
        }
        restartBtn.addEventListener('click', () => { if (confirm('确定要重新开始吗？')) restartGame(); });

        function renderNewUI(html, stageName) {
            displayArea.innerHTML = html;
            document.getElementById('mainContainer').scrollTop = 0;
            saveGameState(stageName || currentStage, currentStep);
            restartBtn.style.display = 'block'; // 进入问答阶段后显示重启按钮
        }

        function takeSnapshot(stageName) {
            if (!stageName || stageName === 'intro' || stageName === 'final_end') return;
            if (!historyOrder.includes(stageName)) { historyOrder.push(stageName); historyBtn.classList.add('visible'); saveHistoryState(); }
        }

        function renderHistoryModal() {
            historyList.innerHTML = '';
            if (historyOrder.length === 0) { historyList.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">暂无完成的卷宗记录...</div>'; return; }
            historyOrder.forEach(stage => { const html = historyTemplates[stage]; if (html) { const d = document.createElement('div'); d.className = 'history-item'; d.innerHTML = html; historyList.appendChild(d); } });
        }
        function openHistory() { renderHistoryModal(); historyOverlay.classList.add('active'); }
        function closeHistory() { historyOverlay.classList.remove('active'); }
        historyBtn.addEventListener('click', openHistory);
        historyCloseBtn.addEventListener('click', closeHistory);
        historyOverlay.addEventListener('click', (e) => { if (e.target === historyOverlay) closeHistory(); });

        // ---------- 逐句显示 ----------
        function appendNextLine() {
            const oldCursor = document.querySelector('.cursor');
            if (oldCursor) oldCursor.remove();
            if (currentStep < storyLines.length) {
                restartBtn.style.display = 'none';
            } else {
                restartBtn.style.display = 'block';
            }
            if (currentStep < storyLines.length) {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'line';
                lineDiv.textContent = storyLines[currentStep];
                displayArea.appendChild(lineDiv);
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                cursorSpan.textContent = '▼';
                displayArea.appendChild(cursorSpan);
                currentStep++;
                document.getElementById('mainContainer').scrollTop = document.getElementById('mainContainer').scrollHeight;
                if (currentStep === storyLines.length) {
                    setTimeout(() => {
                        const finalCursor = document.querySelector('.cursor');
                        if (finalCursor) finalCursor.remove();
                        const btn = document.createElement('button');
                        btn.className = 'summary-btn';
                        btn.textContent = '开始梳理案情';
                        displayArea.appendChild(btn);
                        btn.addEventListener('click', (e) => { e.stopPropagation(); renderQuiz1(); });
                        restartBtn.style.display = 'block';
                        saveGameState('intro', currentStep);
                    }, 400);
                } else {
                    saveGameState('intro', currentStep);
                }
            }
        }

        // 点击式填空引擎
        function initFillMechanic(zoneIds, poolId, correctAnswers, onSuccess, stageName) {
            const zones = Array.isArray(zoneIds) ? zoneIds.map(id => document.getElementById(id)) : [document.getElementById(zoneIds)];
            const pool = document.getElementById(poolId), errorMsg = document.getElementById('error-msg'), container = document.getElementById('dragContainer1') || document.getElementById('dragContainer2') || document.getElementById('dragContainer3');
            let activeZone = null;
            const finalCorrect = Array.isArray(correctAnswers) ? correctAnswers : [correctAnswers];
            const filledData = new Array(zones.length).fill(null);

            function updateCheck() {
                if (filledData.every(v => v !== null)) {
                    const allCorrect = filledData.every((val, idx) => val === finalCorrect[idx]);
                    if (allCorrect) {
                        errorMsg.style.display = 'none';
                        if (container) container.classList.remove('shake');
                        pool.querySelectorAll('.click-item').forEach(el => el.removeEventListener('click', onItemClick));
                        zones.forEach(z => z.removeEventListener('click', onZoneClick));
                        document.removeEventListener('keydown', onKeyDown);
                        takeSnapshot(stageName);
                        if (onSuccess) setTimeout(onSuccess, 300);
                    } else {
                        errorMsg.style.display = 'block'; if (container) container.classList.add('shake');
                        setTimeout(() => { if (container) container.classList.remove('shake'); }, 500);
                    }
                } else {
                    errorMsg.style.display = 'none'; if (container) container.classList.remove('shake');
                }
            }
            function onZoneClick(e) { const t = e.currentTarget; zones.forEach(z => z.classList.remove('active')); t.classList.add('active'); activeZone = t; }
            function onItemClick(e) {
                if (!activeZone) return;
                const content = e.currentTarget.textContent.trim();
                const index = zones.indexOf(activeZone);
                if (filledData[index] !== null) { activeZone.textContent = ''; activeZone.classList.remove('filled'); filledData[index] = null; }
                activeZone.textContent = content; activeZone.classList.add('filled'); filledData[index] = content;
                updateCheck();
            }
            function onKeyDown(e) {
                if ((e.key === 'Backspace' || e.key === 'Delete') && activeZone && activeZone.textContent !== '') {
                    e.preventDefault();
                    const index = zones.indexOf(activeZone);
                    activeZone.textContent = ''; activeZone.classList.remove('filled'); filledData[index] = null;
                    updateCheck();
                }
            }
            zones.forEach(z => { z.addEventListener('click', onZoneClick); });
            pool.querySelectorAll('.click-item').forEach(el => { el.addEventListener('click', onItemClick); });
            document.addEventListener('keydown', onKeyDown);
        }

                if (endCursor) { renderFinalChoice(); return; }
            }
            if (e.target.closest('.cursor') || e.target.closest('.summary-btn') || e.target.closest('.option') || e.target.closest('.submit-fill-btn') || e.target.closest('.fill-input') || e.target.closest('.click-item') || e.target.closest('.drop-zone') || e.target.closest('.restart-btn') || e.target.closest('.history-btn') || e.target.closest('.close-x-btn') || e.target.closest('.history-overlay')) return;
            if (currentStep >= storyLines.length) return;
            appendNextLine();
        });

        closeBtn.addEventListener('click', () => {
            sessionStorage.setItem('return_from_wechat', 'true');
            window.location.href = 'wechat.html';
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadHistoryState();
            const hasSave = loadGameState();
            if (hasSave) {
                if (currentStage === 'intro' && currentStep < storyLines.length) restartBtn.style.display = 'none';
                else restartBtn.style.display = 'block';
                switch (currentStage) {
                    case 'quiz1': renderQuiz1(); break;
                    case 'fill1': renderFillBlank1(); break;
                    case 'quiz2': renderQuiz2(); break;
                    case 'fill2': renderFillBlank2(); break;
                    case 'drag1': renderFillStage1(); break;
                    case 'fill3': renderFillBlank3(); break;
                    case 'drag2': renderComplexFill(); break;
                    case 'story_end': renderLongStory(); break;
                    case 'final_choice': renderFinalChoice(); break;
                    case 'chain_1': renderNextChainQuestion1(); break;
                    case 'chain_2': renderNextChainQuestion2(); break;
                    case 'chain_3': renderNextChainQuestion3(); break;
                    case 'chain_4': renderNextChainQuestion4(); break;
                    case 'chain_5': renderNextChainQuestion5(); break;
                    case 'love_hate': renderLoveHateDilemma(); break;
                    case 'final_end': renderFinalActionButton(); break;
                    default:
                        const initialText = storyLines.slice(0, currentStep);
                        displayArea.innerHTML = '';
                        initialText.forEach(t => { const l = document.createElement('div'); l.className = 'line'; l.textContent = t; displayArea.appendChild(l); });
                        if (currentStep < storyLines.length) { const c = document.createElement('span'); c.className = 'cursor'; c.textContent = '▼'; displayArea.appendChild(c); restartBtn.style.display = 'none'; }
                        else { const btn = document.createElement('button'); btn.className = 'summary-btn'; btn.textContent = '开始梳理案情'; displayArea.appendChild(btn); btn.addEventListener('click', (e) => { e.stopPropagation(); renderQuiz1(); }); restartBtn.style.display = 'block'; }
                        break;
                }
            } else {
                restartBtn.style.display = 'none';
                appendNextLine();
            }
        });
    </script>
</body>
</html>
