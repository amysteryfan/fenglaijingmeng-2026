<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0702录音 - 风来惊梦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Microsoft YaHei', 'SimSun', sans-serif;
            padding: 20px;
        }
        .window {
            width: 680px;
            max-width: 100%;
            background: #c0c0c0;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #000;
            display: flex;
            flex-direction: column;
        }
        .titlebar {
            background: #000080;
            color: #fff;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .titlebar .close-btn {
            background: #c0c0c0;
            border: 2px solid #fff;
            border-right-color: #000;
            border-bottom-color: #000;
            width: 18px;
            height: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
            line-height: 1;
            flex-shrink: 0;          /* 防止被压缩，电脑端不变 */
            position: relative;        /* 为移动端伪元素定位做准备（电脑端不影响） */
        }
        .content {
            display: flex;
            flex: 1;
            gap: 8px;
            padding: 8px;
            background: #c0c0c0;
        }
        .player {
            width: 200px;
            background: #fff;
            border: 2px inset #ddd;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #000;
        }
        .player-title {
            font-weight: bold;
            margin-bottom: 4px;
        }
        .player-icon {
            font-size: 32px;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border: 1px solid #999;
            position: relative;
            margin: 8px 0;
        }
        .progress-fill {
            width: 35%;
            height: 100%;
            background: #000080;
        }
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 4px;
        }
        .win-btn {
            padding: 2px 8px;
            background: #c0c0c0;
            border: 2px solid #fff;
            border-right-color: #000;
            border-bottom-color: #000;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }
        .win-btn:active {
            border: 2px solid #000;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }
        .time-label {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .notepad {
            flex: 1;
            background: #fff;
            border: 2px inset #ddd;
            padding: 12px;
            font-family: 'SimSun', 'Microsoft YaHei', serif;
            font-size: 14px;
            line-height: 1.7;
            color: #000;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .notepad-header {
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
            margin-bottom: 10px;
            color: #000080;
            font-size: 15px;
        }

        /* ===== 移动端适配 (仅调整关闭按钮) ===== */
        @media (max-width: 600px) {
            .window {
                width: 100%;
            }
            .content {
                flex-direction: column;
            }
            .player {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: center;
            }
            .player-icon { font-size: 28px; }
            .progress-bar { width: 80px; }

            /* ---- 关闭按钮在手机上的优化 ---- */
            .titlebar {
                padding: 6px 10px;      /* 增加内边距，给大按钮留空间 */
                min-height: 48px;        /* 保证标题栏高度足够 */
            }
            .titlebar .close-btn {
                width: 40px;             /* 视觉尺寸放大 */
                height: 40px;
                font-size: 22px;         /* ✖ 符号更大 */
                /* 边框样式保持经典不变 */
            }
            /* 用伪元素扩大实际点击热区（视觉不变） */
            .titlebar .close-btn::after {
                content: '';
                position: absolute;
                top: -10px;
                right: -10px;
                bottom: -10px;
                left: -10px;
                border-radius: 2px;      /* 微圆角，更自然 */
            }
            /* 标题文字避免被挤压，留出间距 */
            .titlebar span {
                margin-right: 10px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
                min-width: 0;
            }
        }

        /* 超小屏 (≤400px) 可再略微增大，但非必须 */
        @media (max-width: 400px) {
            .titlebar .close-btn {
                width: 44px;
                height: 44px;
                font-size: 26px;
            }
            .titlebar .close-btn::after {
                top: -8px;
                right: -8px;
                bottom: -8px;
                left: -8px;
            }
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="titlebar">
            <span>📁 0702录音.wav - 语音识别播放器</span>
            <div class="close-btn" id="closeBtn">✖</div>
        </div>
        <div class="content">
            <!-- 左侧播放器（无功能） -->
            <div class="player">
                <div class="player-title">0702录音.wav</div>
                <div class="player-icon">🎵</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="time-label">00:47 / 02:14</div>
                <div class="controls">
                    <button class="win-btn">⏮</button>
                    <button class="win-btn">▶</button>
                    <button class="win-btn">⏭</button>
                    <button class="win-btn">■</button>
                </div>
            </div>

            <!-- 右侧文档 -->
            <div class="notepad">
                <div class="notepad-header">📄 语音识别文字内容</div>
                <div class="text-content">
声音A：呦，侦探。
声音A：调查报告书？我看看。（翻动纸张的声音）嘿！果然跟我预料的一样。
声音A：真的！你不相信？我直觉很准的。看一眼就知道她没有表面上那么简单，这点倒是跟我很像。
声音A：鼎峰的诚意就这样吗？啧啧。（轻笑）我看那小子以后还怎么在我面前拽。别看他好像不声不响，其实憋着坏在融媒体黑我呢。侦探，你怎么不说话啊？
声音B：我的职责，仅限于完成你的委托。不包括陪你闲聊。
声音A：别这么说嘛。这可多亏了你。来，尝尝这个，这可是我最喜欢的好酒。
                </div>
            </div>
        </div>
    </div>

    <script>
        // 关闭按钮跳转到桌面
        document.getElementById('closeBtn').addEventListener('click', function() {
            window.location.href = 'desktop.html';
        });

        // 播放控制按钮保持无反应
        document.querySelectorAll('.player .win-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
