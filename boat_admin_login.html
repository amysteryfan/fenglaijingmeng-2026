<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>风来水榭 - 管理系统登录</title>
    <!-- 引用全局样式 -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* 重置与页面背景设定 - 颜色加深 */
        body.boat-admin-login-page {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            /* 加深后的海洋渐变背景 */
            background: linear-gradient(135deg, #06141c 0%, #0d2a35 40%, #133c4a 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景星星装饰 */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.3), transparent);
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* 底部波浪装饰 */
        .wave-decoration {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            pointer-events: none;
        }

        /* 整个页面右上角的退出按钮 */
        .exit-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999; /* 保证在最顶层 */
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }
        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: rotate(90deg) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }
        .exit-btn:active {
            transform: scale(0.95);
        }
        .exit-btn svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        /* 磨砂玻璃登录卡片 */
        .login-card {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px 35px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            z-index: 10;
        }

        /* 品牌区 */
        .brand-area {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-area img {
            width: 140px;
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }
        .brand-area h1 {
            font-family: "STKaiti", "KaiTi", serif;
            color: #ffffff;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 6px;
            margin: 8px 0 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .brand-area .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: 400;
            margin-top: 4px;
        }

        /* 表单区 */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            letter-spacing: normal;
        }
        .input-group input:focus {
            border-color: rgba(197, 160, 89, 0.6); 
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.05);
        }

        /* 错误提示 */
        .error-msg {
            display: none;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin: 10px 0 15px;
            letter-spacing: 1px;
            background: rgba(255, 0, 0, 0.1);
            padding: 6px 0;
            border-radius: 6px;
            border-left: 3px solid #ff6b6b;
        }

        /* 登录按钮 - 保持厚重坚固感 */
        .login-btn {
            width: 100%;
            padding: 14px 0;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #122433 0%, #1a3849 100%);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-family: inherit;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #1a3849, #1e4257);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            border-color: rgba(197, 160, 89, 0.6);
        }
        .login-btn:active {
            transform: translateY(0);
        }

        /* 忘记密码 */
        .forgot-pwd {
            margin-top: 20px;
            text-align: center;
        }
        .forgot-pwd a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s ease;
            letter-spacing: 1px;
        }
        .forgot-pwd a:hover {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: underline;
        }

        /* 响应式适配 */
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
            .brand-area img { width: 100px; }
            .brand-area h1 { font-size: 22px; letter-spacing: 4px; }
            .brand-area .subtitle { font-size: 11px; }
            .input-group input { padding: 12px 16px; font-size: 14px; }
            .login-btn { padding: 12px 0; font-size: 15px; }
            .exit-btn {
                top: 20px;
                right: 20px;
                width: 38px;
                height: 38px;
            }
            .exit-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body class="boat-admin-login-page">
    
    <!-- 星光背景装饰 -->
    <div class="stars"></div>

    <!-- 【修改点】把退出按钮移到卡片外面，并置于页面右上角，跳转目标改为 boat_message_board.html -->
    <a href="javascript:void(0)" class="exit-btn" onclick="window.location.href='boat_message_board.html'" title="返回留言板">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </a>

    <!-- 登录卡片 -->
    <div class="login-card">
        <!-- 品牌区 -->
        <div class="brand-area">
            <img src="images/boat_logo_white.png" alt="风来水榭 Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <h1 id="fallback-logo" style="display:none;">风来水榭</h1>
            <p class="subtitle">管理层专用通道</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="return false;">
            <div class="input-group">
                <input type="text" id="account" value="UXVlZW5Fc3NpZQ==" placeholder="请输入账号" autocomplete="off" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="区分大小写字母" required>
            </div>

            <!-- 错误提示 -->
            <div id="error-msg" class="error-msg">账号或密码错误</div>

            <button type="button" id="loginBtn" class="login-btn">登 录</button>

            <!-- 忘记密码 -->
            <div class="forgot-pwd">
                <a href="javascript:void(0)" id="forgotBtn">忘记密码？</a>
            </div>
        </form>
    </div>

    <!-- 底部波浪纹 -->
    <svg class="wave-decoration" viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,20 C360,100 720,0 1080,80 C1260,120 1350,100 1440,80 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.04)"/>
        <path d="M0,40 C360,80 720,20 1080,60 C1260,80 1350,60 1440,40 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.02)"/>
    </svg>

    <!-- 引用全局脚本 -->
    <script src="js/main.js"></script>

    <!-- 登录与交互验证逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var accountInput = document.getElementById('account');
            var passwordInput = document.getElementById('password');
            var loginBtn = document.getElementById('loginBtn');
            var errorMsg = document.getElementById('error-msg');
            var forgotBtn = document.getElementById('forgotBtn');

            // 忘记密码点击事件
            forgotBtn.addEventListener('click', function() {
                alert('请用base64解码');
            });

            // 登录按钮点击事件
            loginBtn.addEventListener('click', function() {
                var account = accountInput.value.trim();
                var password = passwordInput.value.trim();
                
                if (account === 'UXVlZW5Fc3NpZQ==' && password === 'QueenEssie') {
                    errorMsg.style.display = 'none';
                    window.location.href = 'boat_admin.html';
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.style.animation = 'shake 0.3s ease';
                    setTimeout(function() {
                        errorMsg.style.animation = '';
                    }, 300);
                }
            });

            // 支持在密码输入框按回车键直接登录
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });

            // 当用户在输入框中重新输入时，隐藏错误提示
            accountInput.addEventListener('input', function() {
                errorMsg.style.display = 'none';
            });
            passwordInput.addEventListener('input', function() {
                errorMsg.style.display = 'none';
            });
        });

        // 错误提示的震动动画
        var style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                75% { transform: translateX(6px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
