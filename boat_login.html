<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>风来水榭 - 客人专属服务登录</title>
    <!-- 引用全局样式 -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* 重置与页面背景设定 */
        body.boat-login-page {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            /* 深蓝到青绿的海洋渐变背景 */
            background: linear-gradient(135deg, #0b2b36 0%, #174e5c 40%, #1b6773 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景星星装饰 */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.6), transparent);
            background-size: 200px 200px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 磨砂玻璃登录卡片 */
        .login-card {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px 35px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 10;
        }

        /* 右上角退出（返回）按钮 */
        .exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
        }
        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            transform: rotate(90deg) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .exit-btn:active {
            transform: scale(0.95);
        }
        /* 为按钮加上悬停提示文字的CSS（通过title属性生效） */
        .exit-btn svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        /* 品牌区 */
        .brand-area {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-area img {
            width: 140px;
            height: auto;
            margin-bottom: 5px;
            /* 为logo增加微弱的白色光晕，使其在暗色背景更突出 */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        .brand-area h1 {
            font-family: "STKaiti", "KaiTi", serif; /* 匹配书法字体 */
            color: #ffffff;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 6px;
            margin: 8px 0 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .brand-area .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: 300;
            margin-top: 4px;
        }

        /* 表单区 */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
        }
        .input-group input:focus {
            border-color: rgba(197, 160, 89, 0.8); /* 金色点缀 */
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.1);
        }

        /* 错误提示 */
        .error-msg {
            display: none;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin: 10px 0 15px;
            letter-spacing: 1px;
            background: rgba(255, 0, 0, 0.1);
            padding: 6px 0;
            border-radius: 6px;
            border-left: 3px solid #ff6b6b;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 14px 0;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            /* 深蓝色与金色点缀的质感 */
            background: linear-gradient(135deg, #1a2f40 0%, #24425a 100%);
            border: 1px solid #c5a059;
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-family: inherit;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #1a2f40, #2a4e6b);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.2);
            border-color: #e5c07b;
        }
        .login-btn:active {
            transform: translateY(0);
        }

        /* 响应式适配 */
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
            .brand-area img { width: 100px; }
            .brand-area h1 { font-size: 22px; letter-spacing: 4px; }
            .brand-area .subtitle { font-size: 11px; }
            .input-group input { padding: 12px 16px; font-size: 14px; }
            .login-btn { padding: 12px 0; font-size: 15px; }
        }
    </style>
</head>
<body class="boat-login-page">
    
    <!-- 星光背景装饰 -->
    <div class="stars"></div>

    <!-- 右上角退出（返回）按钮 -->
    <a href="javascript:void(0)" class="exit-btn" onclick="window.location.href='search_fenglaishuixie.html'" title="返回搜索页面">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </a>

    <!-- 登录卡片 -->
    <div class="login-card">
        <!-- 品牌区：引用您上传的参考图作为Logo -->
        <div class="brand-area">
            <!-- 更新为 boat_logo.png -->
            <img src="images/boat_logo.png" alt="风来水榭 Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <!-- 如果图片未加载出来，显示文字回退 -->
            <h1 id="fallback-logo" style="display:none;">风来水榭</h1>
            <p class="subtitle">客人专属服务</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="return false;">
            <div class="input-group">
                <input type="text" id="account" placeholder="请输入手机号码" autocomplete="off" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="不区分英文大小写，统一使用小写字母" required>
            </div>

            <!-- 错误提示 -->
            <div id="error-msg" class="error-msg">账号或密码错误</div>

            <button type="button" id="loginBtn" class="login-btn">登 录</button>
        </form>
    </div>

    <!-- 底部波浪纹（保留原装饰） -->
    <svg class="wave-decoration" viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; pointer-events: none;">
        <path d="M0,20 C360,100 720,0 1080,80 C1260,120 1350,100 1440,80 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.08)"/>
        <path d="M0,40 C360,80 720,20 1080,60 C1260,80 1350,60 1440,40 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.05)"/>
    </svg>

    <!-- 引用全局脚本 -->
    <script src="js/main.js"></script>

    <!-- 登录验证逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var accountInput = document.getElementById('account');
            var passwordInput = document.getElementById('password');
            var loginBtn = document.getElementById('loginBtn');
            var errorMsg = document.getElementById('error-msg');

            // 登录按钮点击事件
            loginBtn.addEventListener('click', function() {
                var account = accountInput.value.trim();
                // 统一转换为小写，不区分大小写
                var password = passwordInput.value.trim().toLowerCase();
                
                // 验证逻辑
                if (account === '175246' && password === 'hermes') {
                    // 账号密码正确，隐藏错误，跳转到客人主页
                    errorMsg.style.display = 'none';
                    window.location.href = 'boat_guest.html';
                } else {
                    // 错误，显示红色提示
                    errorMsg.style.display = 'block';
                    // 加上微小的震动动画，增加真实感
                    errorMsg.style.animation = 'shake 0.3s ease';
                    setTimeout(function() {
                        errorMsg.style.animation = '';
                    }, 300);
                }
            });

            // 支持在密码输入框按回车键直接登录
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });

            // 当用户在输入框中重新输入时，隐藏错误提示
            accountInput.addEventListener('input', function() {
                errorMsg.style.display = 'none';
            });
            passwordInput.addEventListener('input', function() {
                errorMsg.style.display = 'none';
            });
        });

        // 错误提示的震动动画（CSS中补充）
        var style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                75% { transform: translateX(6px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
