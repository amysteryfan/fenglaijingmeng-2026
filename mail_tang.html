    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #f5f7fa;

            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #333;
        }
        .mail-client {
            width: 960px; max-width: 98vw; height: 90vh; max-height: 700px;
            background: #fff; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .mail-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid #e0e4e8;
            background: #fff; flex-shrink: 0;
        }
        .mail-brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: #1a1a1a; }
        .mail-brand .icon {
            width: 34px; height: 34px; background: #1a73e8; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px;
        }
        .btn-exit {
            padding: 8px 20px; border: 1px solid #d0d5dd; border-radius: 6px;
            background: #fff; font-size: 14px; color: #555; cursor: pointer;
            transition: 0.2s; font-family: inherit; white-space: nowrap;
        }
        .btn-exit:hover { background: #f0f2f5; border-color: #999; }
        .mail-body { display: flex; flex: 1; overflow: hidden; }
        .folder-list {
            width: 200px; background: #fafbfc; border-right: 1px solid #e0e4e8;
            padding: 12px 8px; display: flex; flex-direction: column; gap: 4px;
            flex-shrink: 0;
        }
        .folder-item {
            padding: 10px 16px; border-radius: 6px; font-size: 15px; cursor: pointer;
            color: #333; transition: background 0.15s, color 0.15s;
            display: flex; align-items: center; gap: 8px; font-weight: 500;
        }
        .folder-item:hover { background: #e8f0fe; }
        .folder-item.active { background: #1a73e8; color: #fff; }
        .content-panel { flex: 1; overflow-y: auto; padding: 20px 24px; background: #fff; }
        .email-list { display: flex; flex-direction: column; gap: 2px; }
        .email-item {
            padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
            cursor: pointer; transition: background 0.15s; border-radius: 4px;
        }
        .email-item:hover { background: #f8faff; }
        .email-sender {
            font-weight: 600; font-size: 15px; margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .email-subject { color: #555; font-size: 14px; margin-bottom: 4px; font-weight: 500; }
        .email-preview {
            color: #999; font-size: 13px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis;
        }
        .email-date { font-size: 12px; color: #aaa; margin-left: auto; }
        .draft-list .email-item { cursor: pointer; }
        .draft-list .email-item:hover { background: #f8faff; }
        .letter-view { display: none; }
        .letter-view.show { display: block; }
        .back-link {
            color: #1a73e8; cursor: pointer; font-size: 14px; margin-bottom: 20px;
            display: inline-block; font-weight: 500; padding: 4px 0;
        }
        .back-link:hover { text-decoration: underline; }
        .letter-header { margin-bottom: 20px; }
        .letter-header .field { margin-bottom: 8px; font-size: 14px; color: #555; }
        .letter-header .field strong { display: inline-block; width: 60px; color: #333; }
        .letter-body {
            font-size: 15px; line-height: 1.8; color: #333; white-space: pre-wrap;
            padding: 16px; background: #fafbfc; border-radius: 8px; border: 1px solid #eee;
        }
        .original-mail {
            margin-top: 20px; padding-top: 16px; border-top: 1px dashed #ddd;
        }
        .original-mail .original-label { font-size: 13px; color: #888; margin-bottom: 10px; font-weight: 500; }
        .attachment-box {
            margin-top: 16px; padding: 12px 16px; background: #f0f2f5;
            border: 1px solid #d0d5dd; border-radius: 8px; display: flex;
            align-items: center; gap: 10px; font-size: 14px; color: #555;
            pointer-events: none; user-select: none;
        }
        .empty-state { text-align: center; padding: 40px; color: #aaa; font-size: 15px; }

        @media (max-width: 640px) {
            body { align-items: stretch; }
            .mail-client { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
            .mail-header { padding: 12px 16px; }
            .mail-brand { font-size: 16px; }

            .folder-list { width: 110px; padding: 8px 4px; }

            .letter-header .field { font-size: 13px; }

            .back-link { font-size: 13px; margin-bottom: 16px; }
        }
    </style>
</head>

            function renderContent(folder) {
                const folderData = data[folder];
                if (!folderData) return;
                let html = '';

                if (folderData.type === 'emailList') {
                    html = '<div class="email-list">';
                    folderData.emails.forEach((email, idx) => {
                        html += `

                                <div class="email-sender">${email.sender}<span class="email-date">${email.date}</span></div>
                                <div class="email-subject">${email.subject}</div>
                                <div class="email-preview">${email.preview}</div>
                            </div>`;
                    });
                    html += '</div>';
                } else if (folderData.type === 'sentList') {
                    html = '<div class="email-list">';
                    folderData.emails.forEach((email, idx) => {
                        html += `
                            <div class="email-item" data-email-index="${idx}">
                                <div class="email-sender">${email.sender}<span class="email-date">${email.date}</span></div>
                                <div class="email-subject">${email.subject}</div>
                                <div class="email-preview">${email.preview}</div>
                                <div style="font-size:12px; color:#999;">收件人：${email.recipient}</div>
                            </div>`;
                    });
                    html += '</div>';
                } else if (folderData.type === 'draftList') {
                    html = '<div class="email-list draft-list">';
                    folderData.emails.forEach((email, idx) => {
                        const preview = email.subject.length > 20 ? email.subject.substring(0, 20) + '...' : email.subject;
                        html += `
                            <div class="email-item" data-email-index="${idx}">
                                <div class="email-sender">${email.sender}<span class="email-date">${email.date}</span></div>
                                <div class="email-subject">${email.subject}</div>
                                <div class="email-preview">${preview}</div>
                                <div style="font-size:12px; color:#999;">收件人：${email.recipient}</div>
                            </div>`;
                    });
                    html += '</div>';
                } else if (folderData.type === 'empty') {
                    html = `<div class="empty-state">${folderData.message}</div>`;
                }

                contentPanel.innerHTML = html;

                if (folder === 'drafts' && draftScrollPos > 0) {
                    contentPanel.scrollTop = draftScrollPos;
                    draftScrollPos = 0;
                } else {
                    draftScrollPos = 0;
                }

                if (folderData.type === 'emailList' || folderData.type === 'sentList' || folderData.type === 'draftList') {
                    bindEmailClicks(folderData, folder);
                }
            }

            function bindEmailClicks(folderData, folderName) {
                const emailItems = contentPanel.querySelectorAll('.email-item');
                emailItems.forEach(item => {
                    item.addEventListener('click', function() {
                        if (folderName === 'drafts') {
                            draftScrollPos = contentPanel.scrollTop;
                        }
                        const index = parseInt(this.getAttribute('data-email-index'));
                        const email = folderData.emails[index];
                        renderLetterDetail(email, folderData.type);
                    });
                });
            }

            function renderLetterDetail(email, type) {
                let html = '';
                let backFolder = 'inbox';
                let backText = '← 返回收件箱';
                if (type === 'sentList') { backFolder = 'sent'; backText = '← 返回发信箱'; }
                else if (type === 'draftList') { backFolder = 'drafts'; backText = '← 返回草稿箱'; }

                if (type === 'emailList') {
                    const full = email.fullContent;
                    html = `<div class="letter-view show">
                        <div class="back-link" id="backBtn">${backText}</div>
                        <div class="letter-header">
                            <div class="field"><strong>发件人：</strong>${full.from}</div>
                            <div class="field"><strong>收件人：</strong>${full.to}</div>
                            <div class="field"><strong>时间：</strong>${full.date}</div>
                        </div>
                        <div class="letter-body">${full.body.replace(/\n/g, '<br>')}</div>`;
                    if (email.original) {
                        html += `<div class="original-mail">
                            <div class="original-label">——原始邮件——</div>
                            <div class="letter-header" style="margin-bottom:10px;">
                                <div class="field"><strong>发件人：</strong>${email.original.from}</div>
                                <div class="field"><strong>收件人：</strong>${email.original.to}</div>
                                <div class="field"><strong>时间：</strong>${email.original.date}</div>
                            </div>
                            <div class="letter-body" style="background:#f0f0f0;">${email.original.body.replace(/\n/g, '<br>')}</div>
                        </div>`;
                    }
                    html += `</div>`;
                } else if (type === 'sentList') {
                    html = `<div class="letter-view show">
                        <div class="back-link" id="backBtn">${backText}</div>
                        <div class="letter-header">
                            <div class="field"><strong>发件人：</strong>${email.sender} <tangjingxuan@edu.mail.com></div>
                            <div class="field"><strong>收件人：</strong>${email.recipient}</div>
                            <div class="field"><strong>时间：</strong>${email.date}</div>
                        </div>
                        <div class="letter-body">${email.replyContent.replace(/\n/g, '<br>')}</div>`;
                    if (email.original) {
                        html += `<div class="original-mail">
                            <div class="original-label">——原始邮件——</div>
                            <div class="letter-header" style="margin-bottom:10px;">
                                <div class="field"><strong>发件人：</strong>${email.original.from}</div>
                                <div class="field"><strong>收件人：</strong>${email.original.to}</div>
                                <div class="field"><strong>时间：</strong>${email.original.date}</div>
                            </div>
                            <div class="letter-body" style="background:#f0f0f0;">${email.original.body.replace(/\n/g, '<br>')}</div>
                        </div>`;
                    }
                    html += `</div>`;
                } else if (type === 'draftList') {
                    html = `<div class="letter-view show">
                        <div class="back-link" id="backBtn">${backText}</div>
                        <div class="letter-header">
                            <div class="field"><strong>发件人：</strong>${email.sender}</div>
                            <div class="field"><strong>收件人：</strong>${email.recipient}</div>
                            <div class="field"><strong>时间：</strong>${email.date}</div>
                        </div>
                        <div class="letter-body">${email.body.replace(/\n/g, '<br>')}</div>
                    </div>`;
                }

                contentPanel.innerHTML = html;
                document.getElementById('backBtn').addEventListener('click', () => {
                    renderContent(backFolder);
                    setActiveFolder(backFolder);
                });
            }

            function setActiveFolder(folder) {
                folderItems.forEach(item => {
                    const f = item.getAttribute('data-folder');
                    if (f === folder) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            folderItems.forEach(item => {
                item.addEventListener('click', function() {
                    const folder = this.getAttribute('data-folder');
                    setActiveFolder(folder);
                    draftScrollPos = 0;
                    renderContent(folder);
                });
            });

            btnExit.addEventListener('click', () => {
                window.location.href = 'desktop.html';
            });

            renderContent('inbox');
        })();
    </script>
</body>
</html>
