<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于开通教师专属办公邮箱的通知 - 明德私立学校</title>

    <!-- 引入全局样式和脚本 -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>

    <style>
        /* --- 局部页面专属样式 (基于学校官网风格扩展) --- */
        
        /* 修复滚动问题的核心代码 */
        html, body {
            height: auto;       /* 允许高度随内容拉伸 */
            overflow-y: auto;   /* 强制启用纵向滚动 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #f4f4f4;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* --- 顶部通栏 --- */
        .top-bar {
            background-color: #fff;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 100;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0; /* 防止顶部导航栏被挤压 */
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8B0000; /* 校徽红 */
            display: flex;
            align-items: center;
        }
        
        .logo img {
            height: 40px;
            margin-right: 12px;
        }

        .logo span {
            margin-left: 10px;
            font-size: 14px;
            color: #666;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* 返回首页按钮 */
        .back-home-btn {
            background-color: #8B0000;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(139, 0, 0, 0.3);
        }

        .back-home-btn:hover {
            background-color: #6d0000;
            transform: translateY(-1px);
        }

        /* --- 文章容器 --- */
        .article-container {
            flex: 1 0 auto; /* 核心修复：自动撑开高度 */
            max-width: 880px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .article-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 50px 55px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-top: 4px solid #8B0000; /* 顶部红线增加庄重感 */
        }

        /* 文章头部 */
        .article-header {
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        .article-header h1 {
            font-size: 30px;
            color: #8B0000;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .article-meta {
            color: #999;
            font-size: 14px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* 文章正文 */
        .article-content {
            font-size: 16px;
            line-height: 1.8;
            color: #444;
        }

        .article-content p {
            margin-bottom: 15px;
            text-indent: 2em; /* 首行缩进 */
        }

        /* 默认 strong 标签为红色 */
        .article-content p strong {
            color: #8B0000;
        }

        .article-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: right;
            font-size: 15px;
            color: #666;
            line-height: 1.6;
        }

        /* --- 响应式设计 (适配手机端) --- */
        @media (max-width: 768px) {
            .top-bar {
                padding: 0 15px;
                flex-wrap: wrap;
                height: auto;
                padding-top: 10px;
                padding-bottom: 10px;
            }
            .logo img { height: 30px; }
            .logo { font-size: 18px; }
            .logo span { font-size: 12px; margin-left: 5px; }
            .back-home-btn { padding: 6px 12px; font-size: 13px; }

            .article-card {
                padding: 30px 20px;
            }
            .article-header h1 {
                font-size: 24px;
            }
            .article-content {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部通栏 (与官网保持统一) -->
    <header class="top-bar">
        <div class="logo">
            <!-- 确保 images 下有 school_logo.png -->
            <img src="images/school_logo.png" alt="明德私立学校校徽">
            明德私立学校 <span>MINGDE PRIVATE SCHOOL</span>
        </div>
        <!-- 返回官网首页的按钮 -->
        <a href="school.html" class="back-home-btn">← 返回首页</a>
    </header>

    <!-- 正文容器 -->
    <main class="article-container">
        <div class="article-card">
            
            <!-- 文章头部信息 -->
            <div class="article-header">
                <h1>关于开通教师专属办公邮箱的通知</h1>
                <div class="article-meta">
                    <span>发布部门：明德私立学校 教务处</span>
                    <span>发布日期：2015年10月14日</span>
                </div>
            </div>

            <!-- 文章正文内容 -->
            <div class="article-content">
                <p>全体教职工：</p>
                <p>为进一步规范校内沟通流程，提升办公效率，学校已于2015年10月正式为全体教师开通专属工作邮箱。邮箱地址格式为：<strong>教师姓名@edu.mail.com</strong>。</p>
                <p>初始登录密码统一设置为：<strong>MingdePrivateSchool</strong>。</p>
                <p>请各位老师务必于首次登录后及时修改个人密码，并妥善保管账号信息，以确保校园信息数据安全。</p>
            </div>

            <!-- 文章尾部签名 -->
            <div class="article-footer">
                <p>明德私立学校 教务处</p>
                <p style="font-size: 13px; color: #999; margin-top: 5px;">2015年10月14日</p>
            </div>

        </div>
    </main>

</body>
</html>
