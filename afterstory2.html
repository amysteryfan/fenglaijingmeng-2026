<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>回忆深处 · 日记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 底层背景 */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.35) contrast(1.1);
            z-index: 0;
        }

        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 10%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 入场乱码报错遮罩 */
        .init-error-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background-image: url("images/luanma.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
            pointer-events: all;
            transition: opacity 3s ease-out;
        }
        .init-error-screen.fade-off {
            opacity: 0;
            pointer-events: none;
        }

        /* 日记容器 */
        #diary-wrapper {
            position: relative;
            width: 85vw;
            max-width: 650px;
            height: 75vh;
            max-height: 800px;
            z-index: 5;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left center;
            backface-visibility: hidden;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.7));
        }

        .page-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            background-color: #cbe0f2;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 1.5s ease, filter 1s ease;
        }

        .page-wrapper.state-active {
            transform: rotateY(0deg) translateX(0);
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        .page-wrapper.state-hide-left {
            transform: rotateY(-110deg) translateX(-40px);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .page-wrapper.state-hide-right {
            transform: rotateY(110deg) translateX(40px);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* 日记被火烧的两个阶段：烘烤变色 → 烧毁消失 */
        .page-wrapper.burning img {
            filter: brightness(0.5) sepia(0.4) saturate(1.6);
        }
        .page-wrapper.burned img {
            opacity: 0;
            filter: brightness(0.2) sepia(0.6);
            transform: scale(0.93) translateY(-6px);
        }

        /* 火焰三层状态 */
        .fire-container {
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }
        .fire-container.play-fire {
            opacity: 0.55;
        }
        .fire-container.fire-fading {
            opacity: 0.12;
        }
        .fire-container.fire-gone {
            opacity: 0;
            pointer-events: none;
        }

        .fire-container img {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            left: 0;
            top: 0;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        /* 点击区域 */
        #hint-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            cursor: pointer;
            padding-bottom: 40px;
            pointer-events: auto;
        }

        #hint-icon {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4);
            animation: floatHint 1.8s ease-in-out infinite;
            transition: opacity 0.5s;
        }

        @keyframes floatHint {
            0% { opacity: 0.2; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(8px); }
            100% { opacity: 0.2; transform: translateY(0); }
        }

        .hint-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 结束文案 */
        #end-text {
            position: absolute;
            z-index: 30;
            text-align: center;
            color: rgba(235, 235, 235, 0.55);
            font-size: clamp(1.4rem, 4vw, 2.6rem);
            letter-spacing: 0.2em;
            text-shadow: 0 0 40px rgba(0,0,0,0.9);
            opacity: 0;
            transition: opacity 3s ease-in;
            padding: 0 20px;
            line-height: 1.6;
            font-weight: 300;
            pointer-events: none;
        }

        .text-fade-in {
            opacity: 1 !important;
        }

        /* ---------------------- 跳过弹窗样式 ---------------------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-box {
            background: #1e1e1e;
            padding: 30px 35px;
            border-radius: 18px;
            max-width: 380px;
            width: 85%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            color: #eee;
            font-size: 18px;
            line-height: 1.6;
        }
        .modal-box p {
            margin-bottom: 26px;
            font-weight: 300;
        }
        .modal-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-buttons button {
            padding: 10px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 100px;
        }
        .btn-yes {
            background: #ff6b6b;
            color: #fff;
        }
        .btn-yes:hover {
            background: #ff4f4f;
            transform: scale(1.02);
        }
        .btn-no {
            background: #4a4a4a;
            color: #ccc;
        }
        .btn-no:hover {
            background: #5a5a5a;
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            #diary-wrapper {
                width: 92vw;
                max-width: 550px;
                height: 60vh;
                max-height: 600px;
            }
            .page-wrapper.state-hide-left {
                transform: rotateY(-110deg) translateX(-20px);
            }
            .page-wrapper.state-hide-right {
                transform: rotateY(110deg) translateX(20px);
            }
            #hint-area {
                height: 40%;
                padding-bottom: 25px;
            }
            .modal-box {
                padding: 25px 20px;
                font-size: 16px;
            }
        }

        @media (min-height: 900px) {
            #diary-wrapper {
                max-height: 65vh;
            }
        }
    </style>
</head>
<body>
    <!-- 入场乱码报错图 -->
    <div class="init-error-screen" id="errorScreen"></div>

    <!-- 跳过动画弹窗（默认隐藏） -->
    <div id="skip-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <p>加载似乎较慢，是否跳过加载动画？</p>
            <div class="modal-buttons">
                <button class="btn-yes" onclick="skipAnimation(true)">是，跳过</button>
                <button class="btn-no" onclick="skipAnimation(false)">否，等待</button>
            </div>
        </div>
    </div>

    <div id="app">
        <div id="bg-layer"></div>
        <div id="bg-overlay"></div>

        <!-- 火焰层 -->
        <div class="fire-container" id="fireBox">
            <img src="images/fire1.png" class="fire-img" alt="fire">
            <img src="images/fire2.png" class="fire-img" alt="fire" style="opacity:0">
            <img src="images/fire3.png" class="fire-img" alt="fire" style="opacity:0">
        </div>

        <div id="diary-wrapper" onclick="handlePageClick()">
            <div id="page1" class="page-wrapper state-active">
                <img src="images/riji1.jpg" alt="2011年8月日记" draggable="false">
            </div>
            <div id="page2" class="page-wrapper state-hide-right">
                <img src="images/riji2.jpg" alt="2011年8月日记" draggable="false">
            </div>
        </div>

        <div id="hint-area" onclick="handlePageClick()">
            <div id="hint-icon">▼</div>
        </div>

        <div id="end-text">游戏到此结束，感谢您的游玩。</div>
    </div>

    <script>
        let state = 0;
        let skipFlag = false;          // 是否跳过加载动画
        let slowLoadTimer = null;      // 加载缓慢检测定时器
        let fireAnimationTimer = null;

        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const hintIcon = document.getElementById('hint-area');
        const endText = document.getElementById('end-text');
        const errorScreen = document.getElementById('errorScreen');
        const fireBox = document.getElementById('fireBox');
        const fireImgs = document.querySelectorAll('.fire-img');
        const skipModal = document.getElementById('skip-modal');

        // ---------- 加载缓慢检测 ----------
        // 如果页面在 2.5 秒内没加载完所有资源（含图片），则弹出弹窗
        slowLoadTimer = setTimeout(() => {
            showSkipDialog();
        }, 2500);

        // 页面完全加载后，清除缓慢检测定时器（表示加载很快，不弹窗）
        window.addEventListener('load', () => {
            if (slowLoadTimer) {
                clearTimeout(slowLoadTimer);
                slowLoadTimer = null;
            }
            // 无论是否跳过，正常开始乱码淡出（但如果已经跳过则不再重复执行）
            setTimeout(() => {
                if (!skipFlag) {
                    errorScreen.classList.add('fade-off');
                }
            }, 300);
        });

        // ---------- 弹窗控制 ----------
        function showSkipDialog() {
            skipModal.style.display = 'flex';
        }

        function skipAnimation(choice) {
            skipModal.style.display = 'none';
            if (choice === true) {
                skipFlag = true;
                // 立即隐藏乱码图
                errorScreen.classList.add('fade-off');
                // 如果此时定时器还在，清除它，避免后续再次触发淡出
                if (slowLoadTimer) {
                    clearTimeout(slowLoadTimer);
                    slowLoadTimer = null;
                }
            } else {
                skipFlag = false;
                // 什么也不做，等 load 事件正常淡出乱码图
            }
        }

        // ---------- 正常火焰特效 ----------
        function runFireEffect() {
            fireBox.classList.add('play-fire');
            let index = 0;
            fireAnimationTimer = setInterval(() => {
                fireImgs.forEach(img => img.style.opacity = 0);
                fireImgs[index].style.opacity = 1;
                index = (index + 1) % fireImgs.length;
            }, 220);

            // 日记烘烤变色
            setTimeout(() => page2.classList.add('burning'), 500);
            // 日记开始烧毁消失
            setTimeout(() => page2.classList.add('burned'), 1000);
            // 火焰开始慢慢衰减变暗
            setTimeout(() => fireBox.classList.add('fire-fading'), 2400);
            // 火焰彻底熄灭，停止图片轮播
            setTimeout(() => {
                clearInterval(fireAnimationTimer);
                fireBox.classList.remove('play-fire', 'fire-fading');
                fireBox.classList.add('fire-gone');
            }, 3200);
            // 火焰熄灭后停顿400ms，再弹出结束文字
            setTimeout(() => endText.classList.add('text-fade-in'), 3600);
        }

        // ---------- 点击交互 ----------
        function handlePageClick() {
            if (state === 0) {
                // 第1页 -> 翻页到第2页（riji1 -> riji2）
                state = 1;
                page1.className = 'page-wrapper state-hide-left';
                setTimeout(() => page2.className = 'page-wrapper state-active', 50);
            } else if (state === 1) {
                // 第2页 -> 触发特效（此时才触发，而不是翻页后自动触发）
                state = 2;
                hintIcon.classList.add('hint-hidden');

                if (skipFlag) {
                    // 【跳过模式】：直接让 riji2 淡出，跳过火焰
                    // 如果有残余的火焰定时器，清除掉
                    if (fireAnimationTimer) {
                        clearInterval(fireAnimationTimer);
                        fireAnimationTimer = null;
                    }
                    fireBox.classList.remove('play-fire', 'fire-fading');
                    fireBox.classList.add('fire-gone');

                    // 直接给 riji2 添加 burned 类，触发 css 淡出（opacity:0）
                    page2.classList.add('burned');

                    // 等待淡出动画完成后，浮现结束文字（1.8s 后）
                    setTimeout(() => {
                        endText.classList.add('text-fade-in');
                    }, 1800);
                } else {
                    // 【正常模式】：播放火焰特效
                    runFireEffect();
                }
            } else {
                return;
            }
        }
    </script>
</body>
</html>
