<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>论坛帖子 - 风来惊梦</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ===== 保证可滚动 ===== */
        html, body {
            overflow-y: auto !important;
            overflow-x: hidden;
            height: auto !important;
            min-height: 100vh;
        }

        /* ===== 全局重置 & 基础 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e6e9ef;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: #333;
            padding: 20px 0 40px;
        }

        /* ===== 主容器 ===== */
        .forum-container {
            max-width: 900px;
            margin: 0 auto;
            background: transparent;
            padding: 0 16px;
        }

        /* ===== 顶部返回栏 ===== */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 8px 12px 12px 12px;
            background: transparent;
        }
        .top-bar .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: #2b5ea7;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.7);
            transition: background 0.2s;
        }
        .top-bar .back-btn:hover {
            background: #fff;
            text-decoration: underline;
        }
        .top-bar .back-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ===== 帖子标题栏 ===== */
        .post-header {
            background: #2b5ea7;
            padding: 22px 30px 16px;
            border-radius: 4px 4px 0 0;
            text-align: center;
        }
        .post-header h1 {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .post-header .post-meta {
            color: #d0dce8;
            font-size: 13px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px 24px;
        }
        .post-header .post-meta span {
            display: inline-block;
        }
        .post-header .post-meta .label {
            color: #a0bcd9;
        }
        .post-header .post-meta .value {
            color: #fff;
            font-weight: 500;
        }
        .post-header .post-meta .author-name {
            color: #ffd966;
            font-weight: 600;
        }

        /* ===== 工具条 ===== */
        .toolbar {
            background: #f5f6f9;
            border-left: 1px solid #d6dce5;
            border-right: 1px solid #d6dce5;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            font-size: 13px;
            border-bottom: 1px solid #d6dce5;
        }
        .toolbar .toolbar-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 18px;
        }
        .toolbar .toolbar-left a {
            color: #2b5ea7;
            text-decoration: none;
            font-size: 13px;
        }
        .toolbar .toolbar-left a:hover {
            text-decoration: underline;
        }
        .toolbar .toolbar-left .font-size-select {
            font-size: 13px;
            color: #555;
        }
        .toolbar .toolbar-left .font-size-select select {
            font-size: 12px;
            padding: 1px 4px;
            border: 1px solid #ccc;
            border-radius: 2px;
            background: #fff;
            color: #333;
        }
        .toolbar .toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar .toolbar-right .page-item {
            display: inline-block;
            min-width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            font-size: 13px;
            color: #2b5ea7;
            background: #fff;
            border: 1px solid #d6dce5;
            border-radius: 3px;
            text-decoration: none;
            cursor: default;
        }
        .toolbar .toolbar-right .page-item.active {
            background: #2b5ea7;
            color: #fff;
            border-color: #2b5ea7;
        }
        .toolbar .toolbar-right .page-item.disabled {
            color: #bbb;
            border-color: #e8e8e8;
            background: #fafafa;
            cursor: not-allowed;
        }
        .toolbar .toolbar-right .page-jump {
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 4px;
        }
        .toolbar .toolbar-right .page-jump input {
            width: 36px;
            height: 26px;
            border: 1px solid #ccc;
            border-radius: 2px;
            text-align: center;
            font-size: 13px;
            padding: 0 2px;
        }
        .toolbar .toolbar-right .page-jump button {
            height: 26px;
            padding: 0 10px;
            font-size: 12px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 2px;
            cursor: pointer;
            color: #333;
        }
        .toolbar .toolbar-right .page-jump button:hover {
            background: #e8e8e8;
        }

        /* ===== 楼层列表 ===== */
        .floor-list {
            background: #fff;
            border-left: 1px solid #d6dce5;
            border-right: 1px solid #d6dce5;
            border-bottom: 1px solid #d6dce5;
            border-radius: 0 0 4px 4px;
            overflow: hidden;
        }

        /* ===== 单个楼层 ===== */
        .floor-item {
            padding: 18px 24px 14px;
            border-bottom: 1px solid #eef1f6;
            transition: background 0.1s;
        }
        .floor-item:last-child {
            border-bottom: none;
        }
        .floor-item:hover {
            background: #fafbfc;
        }

        .floor-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
        }
        .floor-header .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            user-select: none;
        }
        .floor-header .author-name {
            font-weight: 600;
            font-size: 14px;
            color: #2b5ea7;
        }
        .floor-header .author-name .op-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 400;
            color: #fff;
            background: #2b5ea7;
            padding: 0 8px;
            border-radius: 3px;
            margin-left: 4px;
            line-height: 18px;
            vertical-align: middle;
        }
        .floor-header .floor-time {
            font-size: 12px;
            color: #999;
        }
        .floor-header .floor-num {
            margin-left: auto;
            font-size: 13px;
            color: #bbb;
            font-weight: 500;
            flex-shrink: 0;
        }

        .floor-body {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            padding: 4px 0 6px 44px;
        }
        .floor-body p {
            margin-bottom: 6px;
        }
        .floor-body p:last-child {
            margin-bottom: 0;
        }
        
        /* ===== 图片样式 ===== */
        .floor-body a {
            display: inline-block;
        }
        .floor-body img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 6px;
            border: 1px solid #eee;
            cursor: pointer; /* 提示可点击 */
            transition: opacity 0.2s;
        }
        .floor-body img:hover {
            opacity: 0.85;
        }

        /* ===== 楼层底部 ===== */
        .floor-footer {
            display: flex;
            justify-content: flex-end;
            padding: 4px 0 0 44px;
            font-size: 13px;
            color: #999;
        }
        .floor-footer .action-btn {
            color: #999;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.15s;
        }
        .floor-footer .action-btn:hover {
            color: #2b5ea7;
        }
        .floor-footer .action-btn .icon {
            font-size: 14px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            body {
                padding: 10px 0 30px;
            }
            .forum-container {
                padding: 0 8px;
            }
            .post-header {
                padding: 16px 14px 12px;
            }
            .post-header h1 {
                font-size: 17px;
                letter-spacing: 0.5px;
            }
            .post-header .post-meta {
                font-size: 12px;
                gap: 8px 14px;
            }
            .toolbar {
                padding: 6px 12px;
                font-size: 12px;
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .toolbar-left {
                justify-content: center;
            }
            .toolbar .toolbar-right {
                justify-content: center;
            }
            .floor-item {
                padding: 14px 14px 12px;
            }
            .floor-header .avatar {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }
            .floor-body {
                font-size: 14px;
                padding-left: 36px;
                padding-right: 0;
            }
            .floor-footer {
                padding-left: 36px;
                font-size: 12px;
            }
            .top-bar .back-btn {
                font-size: 13px;
                padding: 2px 10px;
            }
            .toolbar .toolbar-right .page-item {
                min-width: 24px;
                height: 24px;
                line-height: 24px;
                font-size: 12px;
            }
            .toolbar .toolbar-right .page-jump input {
                width: 30px;
                height: 22px;
                font-size: 12px;
            }
            .toolbar .toolbar-right .page-jump button {
                height: 22px;
                font-size: 11px;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>

    <div class="forum-container">

        <div class="top-bar">
            <a href="forum.html" class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                返回论坛
            </a>
        </div>

        <div class="post-header">
            <h1>这本《罗杰疑案》是谁的啊？</h1>
            <div class="post-meta">
                <span><span class="label">楼主：</span><span class="author-name">爱种西葫芦</span></span>
                <span><span class="label">发表于：</span><span class="value">2026-06-20</span></span>
                <span><span class="label">点击：</span><span class="value">142</span></span>
                <span><span class="label">回复：</span><span class="value">0</span></span>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-left">
                <a href="#">只看楼主</a>
                <a href="#">收藏本帖</a>
                <span class="font-size-select">
                    字体大小：
                    <select id="fontSizeSelect">
                        <option value="small">小</option>
                        <option value="medium" selected>中</option>
                        <option value="large">大</option>
                    </select>
                </span>
            </div>
            <div class="toolbar-right">
                <span class="page-item active">1</span>
                <span class="page-item disabled">2</span>
                <span class="page-item disabled">3</span>
                <span class="page-item disabled">…</span>
                <span class="page-jump">
                    跳转
                    <input type="text" value="1" />
                    <button>GO</button>
                </span>
            </div>
        </div>

        <div class="floor-list" id="floorList">

            <div class="floor-item">
                <div class="floor-header">
                    <div class="avatar" style="background:#27ae60;">爱</div>
                    <span class="author-name">爱种西葫芦 <span class="op-tag">楼主</span></span>
                    <span class="floor-time">2026-06-20</span>
                    <span class="floor-num">1楼</span>
                </div>
                <div class="floor-body">
                    <p>推理社最近在清理积攒的杂物，书架上发现一本英文版《罗杰疑案》。扉页上没署名，就写了个“chess player”。我在社团问了问，社员们都不是这本书的主人，所以来论坛发帖问问：这本书是谁的啊？</p>
                    <!-- 改为使用 a 标签跳转新页面 book.html -->
                    <p><a href="book.html" target="_blank"><img src="images/book.png" alt="《罗杰疑案》书籍扉页照片" /></a></p>
                </div>
                <div class="floor-footer">
                    <a href="#" class="action-btn"><span class="icon">💬</span> 回复</a>
                </div>
            </div>

        </div>

        <div style="text-align:center; padding: 18px 0 4px; font-size:13px; color:#aaa; border-top:1px solid #d6dce5; margin-top:16px; background:#f5f6f9; border-radius:0 0 4px 4px;">
            <span>— 本帖内容仅代表作者个人观点 —</span>
        </div>

    </div>

    <script src="js/main.js"></script>
    <script>
        (function() {
            'use strict';

            var fontSizeSelect = document.getElementById('fontSizeSelect');
            if (fontSizeSelect) {
                fontSizeSelect.addEventListener('change', function() {
                    var size = this.value;
                    var bodies = document.querySelectorAll('.floor-body');
                    bodies.forEach(function(el) {
                        if (size === 'small') {
                            el.style.fontSize = '13px';
                        } else if (size === 'medium') {
                            el.style.fontSize = '15px';
                        } else if (size === 'large') {
                            el.style.fontSize = '18px';
                        }
                    });
                });
            }

            var goBtn = document.querySelector('.page-jump button');
            if (goBtn) {
                goBtn.addEventListener('click', function() {
                    var input = this.previousElementSibling;
                    var val = parseInt(input.value.trim(), 10);
                    if (isNaN(val) || val < 1) val = 1;
                    alert('当前仅第1页有内容，你输入了第 ' + val + ' 页。');
                    input.value = val;
                });
                var input = goBtn.previousElementSibling;
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        goBtn.click();
                    }
                });
            }

            var replyBtns = document.querySelectorAll('.floor-footer .action-btn');
            replyBtns.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('回复功能暂未开放，请继续探索。');
                });
            });

            var只看楼主Btn = document.querySelector('.toolbar-left a[href="#"]');
            if (只看楼主Btn) {
                只看楼主Btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('「只看楼主」功能演示：目前楼主「爱种西葫芦」只有1楼的主贴，将会筛选并显示。');
                });
            }

            var收藏Btn = document.querySelector('.toolbar-left a[href="#"]:nth-child(2)');
            if (收藏Btn) {
                收藏Btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('已收藏本帖（演示功能）。');
                });
            }
        })();
    </script>
</body>
</html>
